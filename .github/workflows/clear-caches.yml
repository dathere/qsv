# Clearing caches regularly takes care of Rust caches growing to problematic size over time
# copied from Polars repo:

name: Clear caches

on:
  schedule:
    - cron: '0 4 * * SUN'
  workflow_dispatch:

# Least privilege: the repo's default GITHUB_TOKEN permission is write.
permissions:
  actions: write
  # actions/checkout needs it: gh infers the repo from the checkout's git remote
  contents: read

jobs:
  clear-caches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Clear all caches
        run: gh cache delete --all
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
