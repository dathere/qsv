name: Publish aarch64-pc-windows-msvc and gnullvm

on:
#   push:
#     tags:
#       - '*'
  workflow_dispatch:

env:
  QSV_KIND: prebuilt

jobs:
  analyze-tags:
    runs-on: ubuntu-24.04
    outputs:
      previous-tag: ${{ steps.previoustag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      #▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼#
      - name: Get previous tag
        id: previoustag
        uses: "WyriHaximus/github-action-get-previous-tag@v2"
      #▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲#
      # - name: delete git repo
      #   run: rm -rf qsv

  publish:
    name: Publish for ${{ matrix.job.target }}
    needs: analyze-tags
    runs-on: ${{ matrix.job.os }}
    strategy:
      matrix:
        rust: [stable]
        job:
          - os: windows-11-arm
            os-name: windows
            target: aarch64-pc-windows-msvc
            architecture: aarch64
            use-cross: false
            addl-build-args: --features=apply,fetch,foreach,luau,polars,readstat,self_update,ui
            # Windows: jemallocator is not supported on Windows, so we use the system allocator.
            default-features: --no-default-features
            addl-qsvlite-features:
            addl-qsvdp-features:
            addl-rustflags: -C target-cpu=native
          - os: windows-11-arm
            os-name: windows
            target: aarch64-pc-windows-gnullvm
            architecture: aarch64
            use-cross: false
            addl-build-args: --features=apply,fetch,foreach,luau,polars,readstat,self_update,ui
            # Windows: jemallocator is not supported on Windows, so we use the system allocator.
            default-features: --no-default-features
            addl-qsvlite-features:
            addl-qsvdp-features:
            # +crt-static links libunwind statically, so the binaries do not need MSYS2's libunwind.dll.
            addl-rustflags: -C target-cpu=native -C target-feature=+crt-static

    steps:
    - name: Installing Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        target: ${{ matrix.job.target }}
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.analyze-tags.outputs.previous-tag }}
    - name: Install Windows ARM64 GNU-family toolchain
      if: matrix.job.target == 'aarch64-pc-windows-gnullvm'
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: CLANGARM64
        update: true
        install: mingw-w64-clang-aarch64-clang
    - name: Use Windows ARM64 GNU-family toolchain
      if: matrix.job.target == 'aarch64-pc-windows-gnullvm'
      shell: pwsh
      env:
        MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
      run: |
        $bin = "$env:MSYS2_LOCATION\clangarm64\bin"
        echo $bin >> $env:GITHUB_PATH
        echo "CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_LINKER=$bin\clang.exe" >> $env:GITHUB_ENV
        # Several dependencies are C and C++, so cc-rs needs the same toolchain.
        echo "CC_aarch64_pc_windows_gnullvm=$bin\clang.exe" >> $env:GITHUB_ENV
        echo "CXX_aarch64_pc_windows_gnullvm=$bin\clang++.exe" >> $env:GITHUB_ENV
        echo "AR_aarch64_pc_windows_gnullvm=$bin\llvm-ar.exe" >> $env:GITHUB_ENV
        # luau is C++; link libc++ statically so the binaries do not need MSYS2's libc++.dll.
        echo "CXXSTDLIB_aarch64_pc_windows_gnullvm=static=c++" >> $env:GITHUB_ENV
        # ...and tell rustc where MSYS2 keeps libc++.a (appended to RUSTFLAGS below).
        echo "GNULLVM_LINK_SEARCH=-L native=$env:MSYS2_LOCATION\clangarm64\lib" >> $env:GITHUB_ENV
    - name: Build qsv
      # env:
      #   RUSTFLAGS: --emit=asm
      env:
        RUSTFLAGS: ${{ matrix.job.addl-rustflags }} ${{ env.GNULLVM_LINK_SEARCH }}
      # actions-rs/cargo is archived/Node20-deprecated (qsv #4002); invoke cargo directly.
      # `+${{ matrix.rust }}` pins the toolchain vs a stale per-directory rustup override on self-hosted runners.
      shell: bash
      run: cargo +${{ matrix.rust }} build --profile ${{ contains(matrix.job.addl-build-args, 'luau') && 'release-luau' || 'release' }} --locked --bin qsv --target ${{ matrix.job.target }} ${{ matrix.job.addl-build-args }},feature_capable ${{ matrix.job.default-features }}
    - name: Build qsvlite
      env:
        RUSTFLAGS: --emit=asm ${{ matrix.job.addl-rustflags }} ${{ env.GNULLVM_LINK_SEARCH }}
      # actions-rs/cargo is archived/Node20-deprecated (qsv #4002); invoke cargo directly.
      # `+${{ matrix.rust }}` pins the toolchain vs a stale per-directory rustup override on self-hosted runners.
      shell: bash
      run: cargo +${{ matrix.rust }} build --release --locked --bin qsvlite --features=lite,self_update,${{ matrix.job.addl-qsvlite-features }} --target ${{ matrix.job.target }} ${{ matrix.job.default-features }}
    - name: Copy binaries to working dir
      shell: bash
      run: |
        mkdir qsv-${{ needs.analyze-tags.outputs.previous-tag }}
        # Ship qsv's license and the third-party notices with every archive:
        # the vendored MIT/BSD components require their notices to travel with copies.
        cp LICENSE-MIT COPYING THIRD_PARTY_NOTICES.md qsv-${{ needs.analyze-tags.outputs.previous-tag }}/
        # qsv uses release-luau (panic=unwind, qsv #3937) when built with luau, else release; the other bins use release
        for d in release-luau release; do
          rm -f target/${{ matrix.job.target }}/$d/*.d 2>/dev/null || true
          cp -v target/${{ matrix.job.target }}/$d/qsv* qsv-${{ needs.analyze-tags.outputs.previous-tag }} 2>/dev/null || true
        done
    - name: zip up binaries
      run: 7z a -tzip qsv-${{ needs.analyze-tags.outputs.previous-tag }}-${{ matrix.job.target }}.zip ./qsv-${{ needs.analyze-tags.outputs.previous-tag }}/* -mx=9 -mmt=on
    - name: install zipsign
      run: |
        cargo install zipsign
    - name: Fetch zipsign private key
      # replaces mobiledevops/secret-to-file-action (Node20-deprecated, qsv #4002):
      # decode the base64 secret to qsvpriv.key. bash shell + `base64 -d` work on all
      # runners (incl. Windows git-bash, macOS/BSD). Secret passed via env, not inlined.
      shell: bash
      env:
        ZIPSIGN_KEY: ${{ secrets.QSV_ZIPSIGN_PRIV_KEY }}
      run: printf '%s' "$ZIPSIGN_KEY" | base64 -d > qsvpriv.key
    - name: zipsign binary
      run: |
        zipsign sign zip qsv-${{ needs.analyze-tags.outputs.previous-tag }}-${{ matrix.job.target }}.zip qsvpriv.key
    - name: Upload zipped binaries to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: qsv-${{ needs.analyze-tags.outputs.previous-tag }}-${{ matrix.job.target }}.zip
        asset_name: qsv-${{ needs.analyze-tags.outputs.previous-tag }}-${{ matrix.job.target }}.zip
        overwrite: true
        tag: ${{ needs.analyze-tags.outputs.previous-tag }}    
 
