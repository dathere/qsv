name: Publish s390x

# Apache DataSketches (datasketches crate) is target-conditional and excluded
# on big-endian targets — see Cargo.toml's
# `[target.'cfg(not(target_endian = "big"))'.dependencies]` block. As a result,
# the s390x binaries built here do NOT include the t-digest / HyperLogLog /
# Frequent Items code paths: `stats --quantile-method approx`,
# `stats --cardinality-method approx`, and `frequency --sketch-method frequent_items`
# all return a "requires a little-endian target" error on s390x. The exact-method
# defaults are unaffected.
#
# The `geocode` and `viz` features are DELIBERATELY absent from the build args
# below -- do not "simplify" them to `distrib_features`, which resolves to include
# BOTH:
#   * `viz` is a hard compile_error! on big-endian (see src/cmd/mod.rs).
#   * `geocode` pulls geosuggest-core -> kiddo, whose build.rs calls
#     yep_cache_line_size::get_cache_line_size() unconditionally; that crate exports
#     nothing outside x86/ARM, so the build script fails to compile natively on
#     s390x (E0425). Filed upstream as sdd/kiddo#536.
# Cargo.toml gates geosuggest-core out of [dev-dependencies] on big-endian, which
# keeps `cargo test` working in rust-s390x.yml -- but that gate does NOT protect
# this workflow, where enabling `geocode` would make kiddo a NORMAL dependency.
# Verify any change here with:
#   cargo tree --target s390x-unknown-linux-gnu -e normal,build -i kiddo \
#     --no-default-features --features <the list below>,feature_capable
# which must report "nothing to print".

on:
#   push:
#     tags:
#       - '*'
  workflow_dispatch:

env:
  QSV_KIND: prebuilt

jobs:
  analyze-tags:
    runs-on: ubuntu-24.04-s390x
    outputs:
      previous-tag: ${{ steps.previoustag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      #▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼#
      - name: Get previous tag
        id: previoustag
        uses: "WyriHaximus/github-action-get-previous-tag@v2"
      #▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲#
      # - name: delete git repo
      #   run: rm -rf qsv

  publish:
    name: Publish for ${{ matrix.job.target }}
    needs: analyze-tags
    runs-on: ${{ matrix.job.os }}
    strategy:
      matrix:
        rust: [stable]
        job:
          - os: ubuntu-24.04-s390x
            os-name: linux
            target: s390x-unknown-linux-gnu
            architecture: s390x
            addl-build-args: --features=apply,fetch,foreach,luau,python,self_update,ui,synthesize
            default-features:
            addl-qsvlite-features:
            addl-qsvdp-features:
            addl-rustflags:

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.analyze-tags.outputs.previous-tag }}
    - name: apt-get update Ubuntu, libwayland-dev
      run: |
        sudo apt-get update
        sudo apt-get install libwayland-dev
    - name: Installing Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        targets: s390x-unknown-linux-gnu
    - name: Build qsv
      env:
        RUSTFLAGS: --emit=asm ${{ matrix.job.addl-rustflags }} -C target-cpu=native
      # actions-rs/cargo is archived/Node20-deprecated (qsv #4002); invoke cargo directly.
      # `+${{ matrix.rust }}` pins the toolchain vs a stale per-directory rustup override on self-hosted runners.
      shell: bash
      run: cargo +${{ matrix.rust }} build --profile ${{ contains(matrix.job.addl-build-args, 'luau') && 'release-luau' || 'release' }} --locked --bin qsv --target ${{ matrix.job.target }} ${{ matrix.job.addl-build-args }},feature_capable ${{ matrix.job.default-features }}
    - name: Build qsvlite
      env:
        RUSTFLAGS: --emit=asm ${{ matrix.job.addl-rustflags }} -C target-cpu=native
      # actions-rs/cargo is archived/Node20-deprecated (qsv #4002); invoke cargo directly.
      # `+${{ matrix.rust }}` pins the toolchain vs a stale per-directory rustup override on self-hosted runners.
      shell: bash
      run: cargo +${{ matrix.rust }} build --release --locked --bin qsvlite --features=lite,self_update,${{ matrix.job.addl-qsvlite-features }} --target ${{ matrix.job.target }} ${{ matrix.job.default-features }}
    # - name: Build qsvdp
    #   env:
    #     RUSTFLAGS: --emit=asm ${{ matrix.job.addl-rustflags }} -C target-cpu=native
    #   shell: bash
    #   run: cargo +${{ matrix.rust }} build --release --locked --bin qsvdp --features=datapusher_plus,${{ matrix.job.addl-qsvdp-features }} --target ${{ matrix.job.target }} ${{ matrix.job.default-features }}
    - name: Copy binaries to working dir
      shell: bash
      run: |
        mkdir qsv-${{ needs.analyze-tags.outputs.previous-tag }}
        # Ship qsv's license and the third-party notices with every archive:
        # the vendored MIT/BSD components require their notices to travel with copies.
        cp LICENSE-MIT COPYING THIRD_PARTY_NOTICES.md qsv-${{ needs.analyze-tags.outputs.previous-tag }}/
        # qsv uses release-luau (panic=unwind, qsv #3937) when built with luau, else release; the other bins use release
        for d in release-luau release; do
          rm -f target/${{ matrix.job.target }}/$d/*.d 2>/dev/null || true
          cp -v target/${{ matrix.job.target }}/$d/qsv* qsv-${{ needs.analyze-tags.outputs.previous-tag }} 2>/dev/null || true
        done
    # - name: Create README
    #   shell: bash
    #   run: |
    #     cat docs/publishing_assets/README.txt docs/publishing_assets/qsv-${{ matrix.job.target }}.txt > qsv-${{ needs.analyze-tags.outputs.previous-tag }}/README
    - name: zip up binaries
      run: 7z a -tzip qsv-${{ needs.analyze-tags.outputs.previous-tag }}-${{ matrix.job.target }}.zip ./qsv-${{ needs.analyze-tags.outputs.previous-tag }}/* -mx=9 -mmt=on
    - name: install zipsign
      run: |
        cargo install zipsign
    - name: Fetch zipsign private key
      # replaces mobiledevops/secret-to-file-action (Node20-deprecated, qsv #4002):
      # decode the base64 secret to qsvpriv.key. bash shell + `base64 -d` work on all
      # runners (incl. Windows git-bash, macOS/BSD). Secret passed via env, not inlined.
      shell: bash
      env:
        ZIPSIGN_KEY: ${{ secrets.QSV_ZIPSIGN_PRIV_KEY }}
      run: printf '%s' "$ZIPSIGN_KEY" | base64 -d > qsvpriv.key
    - name: zipsign binary
      run: |
        zipsign sign zip qsv-${{ needs.analyze-tags.outputs.previous-tag }}-${{ matrix.job.target }}.zip qsvpriv.key
    - name: Upload zipped binaries to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: qsv-${{ needs.analyze-tags.outputs.previous-tag }}-${{ matrix.job.target }}.zip
        asset_name: qsv-${{ needs.analyze-tags.outputs.previous-tag }}-${{ matrix.job.target }}.zip
        overwrite: true
        tag: ${{ needs.analyze-tags.outputs.previous-tag }}    
 
