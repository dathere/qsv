name: Publish

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

# NOTE: QSV_KIND is deliberately NOT set here. The build now happens in the reusable
# publish-target.yml, and a caller's workflow-level env does NOT propagate into a reusable
# workflow - setting it here would look effective while build.rs silently fell back to
# "compiled". It is set in publish-target.yml instead.

jobs:
  analyze-tags:
    runs-on: ubuntu-22.04
    outputs:
      previous-tag: ${{ steps.previoustag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      #▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼#
      - name: Get previous tag
        id: previoustag
        uses: "WyriHaximus/github-action-get-previous-tag@v2"
      #▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲#
      # - name: delete git repo
      #   run: rm -rf qsv

  publish:
    name: Publish for ${{ matrix.job.target }}
    needs: analyze-tags
    strategy:
      # don't cancel the other target builds if one fails; each platform publishes independently
      fail-fast: false
      matrix:
        rust: [stable]
        job:
          - os: ubuntu-24.04
            os-name: linux
            target: x86_64-unknown-linux-gnu
            architecture: x86_64
            use-cross: false
            addl-build-args: --features=apply,luau,fetch,foreach,self_update,geocode,polars,to,lens,prompt,magika,color,viz_static,viz,profile,synthesize
            default-features:
            addl-qsvlite-features:
            addl-qsvdp-features:
            addl-rustflags:
            # native runner - PGO-optimize the main qsv binary (issue #1448)
            pgo: true
            pgo-train-flags:
            pgo-lto:
            # no link-time tuning - keep Cargo.toml's fat LTO + codegen-units=1
            lto:
            codegen-units:
            # sequential build keeps the #4372 dependency sharing, worth more here than parallelism
            split-mcp: false
          - os: ubuntu-24.04
            os-name: linux
            target: x86_64-unknown-linux-musl
            architecture: x86_64
            musl-prep: true
            use-cross: false
            addl-build-args: --features=apply,fetch,foreach,self_update,lens,color,synthesize
            default-features:
            addl-qsvlite-features:
            addl-qsvdp-features:
            addl-rustflags:
            # musl is a reduced-feature, lower-priority target - PGO deferred (plan #1448)
            pgo: false
            pgo-train-flags:
            pgo-lto:
            # no link-time tuning - keep Cargo.toml's fat LTO + codegen-units=1
            lto:
            codegen-units:
            # sequential build keeps the #4372 dependency sharing, worth more here than parallelism
            split-mcp: false
          # - os: ubuntu-24.04
          #   os-name: linux
          #   target: i686-unknown-linux-gnu
          #   architecture: i686
          #   use-cross: true
          #   addl-build-args: --features=apply,fetch,foreach,self_update
          #   default-features:
          #   addl-qsvlite-features:
          #   addl-qsvdp-features:
          #   addl-rustflags:
          - os: windows-latest
            os-name: windows
            target: x86_64-pc-windows-msvc
            architecture: x86_64
            use-cross: false
            # viz_static is deliberately absent: it does not finish a Windows release
            # build inside the 6h job cap (run 31243109948). See Cargo.toml's viz_static
            # note. Windows ships interactive HTML dashboards, no static image export.
            addl-build-args: --features=apply,luau,fetch,self_update,geocode,polars,to,lens,foreach,prompt,magika,color,viz
            # Windows: jemallocator is not supported on Windows, so we use the system allocator.
            default-features: --no-default-features
            addl-qsvlite-features:
            addl-qsvdp-features:
            addl-rustflags:
            # native runner - PGO with --minimal training (benchmarks.sh data prep
            # does not run natively on Windows; train via git-bash on a synthesized CSV)
            pgo: true
            pgo-train-flags: --minimal
            # the non-PGO builds get thin LTO via `lto:` below; this is the same override
            # for the PGO optimize build, which build-pgo.sh applies separately.
            pgo-lto: thin
            # Windows link-time tuning. fat LTO + codegen-units=1 on a polars-sized binary is
            # the most expensive possible setting and the link phase is largely serial;
            # Windows is the only target where that cost has blown the job cap. Trades some
            # runtime performance for build time on this platform only.
            lto: thin
            # quoted: publish-target.yml declares codegen_units as `type: string`,
            # so keep the matrix value a string rather than a YAML integer.
            codegen-units: '16'
            # Windows is the slowest target. 330 (not 270) because `qsvmcp` - not `qsv` -
            # is the most expensive step here: it is a second full PGO build over
            # essentially the same polars+viz feature set this entry builds for `qsv`.
            # (The qsvmcp feature delta is just `mcp`; get/get_cloud were dropped from
            # qsvmcp in #4368, and profile/synthesize are already in the `qsv` list
            # above.) In run 31261021249 the msvc qsv PGO build took 139m and qsvmcp ran
            # longer still. The old 270 was calibrated on a 3h28m pre-viz baseline that
            # predates viz being in BOTH builds. If this cap is ever hit, drop `pgo` here
            # before dropping `viz` - it removes a full qsv build.
            job-timeout: 330
            # qsvmcp gets its own runner: it has never finished alongside qsv inside
            # one cap (>=268m on gnu in run 31287336214).
            split-mcp: true
          # - os: windows-latest
          #   os-name: windows
          #   target: i686-pc-windows-msvc
          #   architecture: i686
          #   use-cross: true
          #   addl-build-args: --features=apply,fetch,self_update
          #   default-features:
          #   addl-qsvlite-features:
          #   addl-qsvdp-features:
          #   addl-rustflags:
          - os: windows-latest
            os-name: windows
            target: x86_64-pc-windows-gnu
            architecture: x86_64
            use-cross: false
            # viz_static deliberately absent - see the msvc entry above.
            addl-build-args: --features=apply,luau,fetch,self_update,geocode,polars,to,lens,foreach,prompt,color,viz
            # Windows: jemallocator is not supported on Windows, so we use the system allocator.
            default-features: --no-default-features
            addl-qsvlite-features:
            addl-qsvdp-features:
            addl-rustflags:
            # PGO disabled for windows-gnu: the msvc host cross-compiles to the gnu
            # target, but rustup's stable rust-std for x86_64-pc-windows-gnu does not
            # ship the profiler runtime, so PGO instrumentation fails to build
            # (error[E0463]: can't find crate for `profiler_builtins`). Supplying it
            # would require nightly + -Zbuild-std. Fall back to a normal optimized
            # build; PGO stays enabled for msvc + linux + macOS targets.
            pgo: false
            pgo-train-flags: --minimal
            pgo-lto:
            # Windows link-time tuning. fat LTO + codegen-units=1 on a polars-sized binary is
            # the most expensive possible setting and the link phase is largely serial;
            # Windows is the only target where that cost has blown the job cap. Trades some
            # runtime performance for build time on this platform only.
            lto: thin
            # quoted: publish-target.yml declares codegen_units as `type: string`,
            # so keep the matrix value a string rather than a YAML integer.
            codegen-units: '16'
            # see the msvc entry - Windows is the slowest target.
            job-timeout: 330
            split-mcp: true
          # - os: macos-12
          #   os-name: macos
          #   target: x86_64-apple-darwin
          #   architecture: x86_64
          #   use-cross: false
          #   addl-build-args: --features=apply,luau,fetch,foreach,self_update,polars
          #   default-features: --no-default-features
          #   addl-qsvlite-features:
          #   addl-qsvdp-features:
          # - os: macos-12
          #   os-name: macos
          #   target: aarch64-apple-darwin
          #   architecture: aarch64
          #   use-cross: true
          #   addl-build-args: --features=apply,fetch,foreach,self_update
          #   default-features: --no-default-features
          #   addl-qsvlite-features:
          #   addl-qsvdp-features:
          - os: ubuntu-24.04-arm
            os-name: linux
            target: aarch64-unknown-linux-gnu
            architecture: aarch64
            # build natively on GitHub's hosted ARM runner instead of QEMU cross-compiling
            use-cross: false
            addl-build-args: --features=apply,fetch,foreach,self_update,lens,color,synthesize
            default-features:
            addl-qsvlite-features:
            addl-qsvdp-features:
            addl-rustflags:
            # native ARM runner - PGO the qsv binary. The PGO optimize build is one more
            # fat-LTO link of the same qsv that already builds here, so memory use matches
            # today's working build. If the OPTIMIZE/LINK step OOMs, set pgo-lto: thin as
            # the escape hatch.
            # NOTE: pgo-lto does NOT help a TRAIN-step OOM. Training runs the instrumented
            # binary over the 1M-row NYC 311 file, and a training command that needs more
            # than the runner's ~15.5 GiB kills the runner VM (exit 143, "runner has
            # received a shutdown signal") - it looks like a link failure but is not.
            # See the moarstats --bivariate note in scripts/pgo-train.sh.
            pgo: true
            pgo-train-flags:
            pgo-lto:
            # no link-time tuning - keep Cargo.toml's fat LTO + codegen-units=1
            lto:
            codegen-units:
            # sequential build keeps the #4372 dependency sharing, worth more here than parallelism
            split-mcp: false
          # - os: ubuntu-20.04
          #   os-name: linux
          #   target: arm-unknown-linux-gnueabihf
          #   architecture: arm
          #   use-cross: true
          #   addl-build-args: --features=apply,luau,fetch,foreach,self_update
          #   default-features: --no-default-features
          # - os: ubuntu-20.04
          #   os-name: linux
          #   target: arm-unknown-linux-musleabihf
          #   architecture: arm
          #   use-cross: true
          #   addl-build-args: --features=apply,luau,fetch,foreach,self_update
          #   default-features: --no-default-features
          # - os: ubuntu-24.04
          #   os-name: linux
          #   target: powerpc64le-unknown-linux-gnu
          #   architecture: powerpc64le
          #   use-cross: true
          #   addl-build-args: --features=apply,fetch,foreach,self_update,lens
          #   default-features:
          #   addl-qsvlite-features:
          #   addl-qsvdp-features:
          #   addl-rustflags:
    # The build steps live in the reusable publish-target.yml so publish-windows.yml can
    # rebuild ONLY the Windows targets without re-running - and re-uploading - the others.
    # `timeout-minutes` is not a legal key on a job that calls a reusable workflow, so the
    # cap is passed as the job_timeout input instead.
    uses: ./.github/workflows/publish-target.yml
    with:
      os: ${{ matrix.job.os }}
      os_name: ${{ matrix.job.os-name }}
      target: ${{ matrix.job.target }}
      previous_tag: ${{ needs.analyze-tags.outputs.previous-tag }}
      rust: ${{ matrix.rust }}
      addl_build_args: ${{ matrix.job.addl-build-args }}
      default_features: ${{ matrix.job.default-features }}
      addl_qsvlite_features: ${{ matrix.job.addl-qsvlite-features }}
      addl_qsvdp_features: ${{ matrix.job.addl-qsvdp-features }}
      addl_rustflags: ${{ matrix.job.addl-rustflags }}
      # `|| false` / `|| 240`: these keys are absent on most matrix entries, and an empty
      # string is not a legal value for a typed boolean/number input.
      musl_prep: ${{ matrix.job.musl-prep || false }}
      pgo: ${{ matrix.job.pgo || false }}
      pgo_train_flags: ${{ matrix.job.pgo-train-flags }}
      pgo_lto: ${{ matrix.job.pgo-lto }}
      lto: ${{ matrix.job.lto }}
      codegen_units: ${{ matrix.job.codegen-units }}
      split_mcp: ${{ matrix.job.split-mcp || false }}
      job_timeout: ${{ matrix.job.job-timeout || 240 }}
    secrets:
      QSV_ZIPSIGN_PRIV_KEY: ${{ secrets.QSV_ZIPSIGN_PRIV_KEY }}
