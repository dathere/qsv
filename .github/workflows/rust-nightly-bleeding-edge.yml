name: Linux Nightly Bleeding Edge
# use the LATEST version of the Rust nightly toolchain to test qsv. 
# This will often fail, but it's useful to see if the code is working.
# Most failures are due to polars being pinned to a specific nightly version.
# See rust-polars-pinned-nightly.yml for a nightly build that is known to
# work with polars.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Least privilege: the repo's default GITHUB_TOKEN permission is write.
permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    # Hard cap so a hung test fails fast instead of burning the 6-hour GitHub default.
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: apt-get update Ubuntu, libwayland-dev
      run: |
        sudo apt-get update
        sudo apt-get install libwayland-dev
    - name: Install and Run Redis
      run: |
        sudo apt-get install redis-server
        sudo service redis-server start
    - name: Installing Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-29
      with:
        # get the LATEST rust nightly
        toolchain: nightly
        components: rust-src
        target: x86_64-unknown-linux-gnu
    - name: Run tests
      run: cargo test --verbose --locked --features=apply,fetch,foreach,geocode,luau,python,feature_capable,nightly,to,polars,nightly-polars,lens
