name: Linux Nightly using Polars pinned nightly version

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Least privilege: the repo's default GITHUB_TOKEN permission is write.
permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    # Hard cap so a hung test fails fast instead of burning the 6-hour GitHub default.
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: apt-get update Ubuntu, libwayland-dev
      run: |
        sudo apt-get update
        sudo apt-get install libwayland-dev
    - name: Install and Run Redis
      run: |
        sudo apt-get install redis-server
        sudo service redis-server start
    - name: Installing Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-29
      with:
        # get nightly version Polars is using
        # https://github.com/pola-rs/polars/blob/main/rust-toolchain.toml
        toolchain: nightly
        components: rust-src
        target: x86_64-unknown-linux-gnu
    - name: Run tests
      # env:
      #   RUSTFLAGS: -C target-cpu=native
      run: cargo test --verbose --locked --features=apply,fetch,foreach,geocode,luau,python,feature_capable,nightly,polars,lens
