name: qsvdp - Datapusher+ optimized qsv

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ci-qsvdp-tests-${{ github.ref }}-1
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Least privilege: the repo's default GITHUB_TOKEN permission is write.
permissions:
  contents: read

jobs:
  build:
    # Skip CI for MCP-only commits (commit message contains "(mcp):")
    if: |
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '(mcp):')

    runs-on: ubuntu-latest
    # Hard cap so a hung test fails fast instead of burning the 6-hour GitHub default.
    timeout-minutes: 90

    steps:
    - name: Free disk space
      uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6   # v2.0.0
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: false
        swap-storage: true
    - uses: actions/checkout@v7
    - name: apt-get update Ubuntu, libwayland-dev
      run: |
        sudo apt-get update
        sudo apt-get install libwayland-dev
    - name: Installing Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-29
      with:
        toolchain: stable
    - name: Setup Rust-cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: qsvdp-cache
    - name: Run tests
      # env:
        # RUSTFLAGS: -C target-cpu=native
      run: cargo test --verbose --locked --features=datapusher_plus
