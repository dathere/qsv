name: s390x

on:
  workflow_dispatch:

concurrency:
  group: ci-s390x-tests-${{ github.ref }}-1
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-24.04-s390x
    # Hard cap so a hung test fails fast instead of burning the 6-hour GitHub default.
    timeout-minutes: 90

    steps:
    - name: apt-get update Ubuntu, libwayland-dev
      run: |
        sudo apt-get update
        sudo apt-get install libwayland-dev
        sudo apt-get install binutils-s390x-linux-gnu
        sudo apt-get -y upgrade
    - uses: actions/checkout@v7
    # - uses: actions/setup-python@v6.0.0
    #   with:
    #     python-version: '3.13'
    - name: Install and Run Redis
      run: |
        sudo apt-get install redis-server
        sudo service redis-server start
    - name: Installing Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        targets: s390x-unknown-linux-gnu
    - name: Setup Rust-cache
      uses: Swatinem/rust-cache@v2
      with:
        key: qsv-s390xcache
    - name: Run tests
      env:
        RUSTFLAGS: -C target-cpu=native
      # Apache DataSketches (datasketches crate) is excluded on big-endian targets
      # because its upstream C++ does not support big-endian. The qsv source gates
      # the `stats --quantile-method approx`, `stats --cardinality-method approx`,
      # and `frequency --sketch-method frequent_items` codepaths behind
      # `#[cfg(not(target_endian = "big"))]` and the CLI rejects those flags at
      # runtime on s390x with a clear platform error. The integration tests below
      # exercise those flags and so are skipped here; the surrounding `_invalid_value_`
      # / `_exact_` tests still run and cover the non-sketch paths.
      # `frequency_sketch_method_invalid_map_size_is_rejected` is also skipped:
      # it asserts a "power of two" error, but on s390x the new platform-rejection
      # error fires before --sketch-map-size validation, so the assertion would no
      # longer match. The dedicated `*_big_endian_*_rejected` tests in
      # tests/test_stats.rs / tests/test_frequency.rs (compiled in only on
      # big-endian) cover the platform-rejection error message instead.
      #
      # The three cache/regression skips (stats_cache_not_reused_when_cardinality_
      # method_differs, stats_everything_approx_quantiles_header_matches_records,
      # frequency_all_unique_shortcut_skipped_on_approx_cardinality_cache) are NOT
      # part of the *_method_* naming families above -- they merely USE an approx
      # flag to set up a fixture, so the prefix patterns miss them and they failed
      # here on 2026-08-22.
      # To re-derive the full list after adding a test: find every #[test] in
      # tests/test_stats.rs and tests/test_frequency.rs that passes
      # --cardinality-method approx, --quantile-method approx, or
      # --sketch-method frequent_items AND asserts SUCCESS. Tests that assert the
      # rejection (`*_rejected`, `*_invalid_value_*`) must keep running here.
      # CAVEAT: that flag search only finds tests passing the flags LITERALLY. Tests
      # that reach the same codepaths another way -- the stats_oom_* family, which
      # relies on OOM auto-enabling approx sketches -- are not covered by it. Those
      # pass on s390x today; re-check them by hand if the auto-enable logic changes.
      # run: cargo test s390x --verbose --locked --features=apply,fetch,foreach,luau,python,feature_capable,ui -- --nocapture
      run: |
        cargo test --verbose --locked --features=apply,fetch,foreach,luau,python,feature_capable,ui -- \
          --skip stats_quantile_method_approx_ \
          --skip stats_cardinality_method_approx_ \
          --skip frequency_sketch_method_frequent_items_ \
          --skip frequency_sketch_method_invalid_map_size_is_rejected \
          --skip stats_cache_not_reused_when_cardinality_method_differs \
          --skip stats_everything_approx_quantiles_header_matches_records \
          --skip frequency_all_unique_shortcut_skipped_on_approx_cardinality_cache
