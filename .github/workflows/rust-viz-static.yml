name: Linux viz static export

# The `viz_static` tests in tests/test_viz.rs render through plotly's headless-browser exporter,
# so they are `#[ignore]`d and never run in the normal test workflows. That left them invisible:
# the 1:1 twin-collapse (issue #4221) invalidated two of their fixtures and nothing caught it for
# a month (issue #4343). This workflow actually runs them.
#
# NOTE: this is a safety net, not per-PR protection — it does not run on every PR. Fixture
# premises that can be checked without a browser belong in a normal `#[test]`, e.g.
# `viz_smart_twelve_distinct_cardinality_columns_all_charted`.

on:
  push:
    branches: [ master ]
    paths:
      - 'src/cmd/viz.rs'
      - 'tests/test_viz.rs'
      # The UCUM display table feeds the hover contract (issue #4557): viz.rs's `unit_suffix`
      # calls `describegpt::dictionary::ucum_display_symbol`, so a symbol edited here lands
      # in a hovertemplate. This trigger re-renders the fixture, which uses `%` and only `%`.
      # It therefore does NOT validate a symbol somebody just added (roborev 4611) — that is
      # `ucum_display_symbols_are_inert_in_a_hovertemplate` in dictionary.rs, a browser-free
      # check over the WHOLE table that runs in every job. Keep this entry for the `%` case
      # the browser does cover; do not read it as protecting the rest of the table.
      - 'src/cmd/describegpt/dictionary.rs'
      - '.github/workflows/rust-viz-static.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'src/cmd/viz.rs'
      - 'tests/test_viz.rs'
      # The UCUM display table feeds the hover contract (issue #4557): viz.rs's `unit_suffix`
      # calls `describegpt::dictionary::ucum_display_symbol`, so a symbol edited here lands
      # in a hovertemplate. This trigger re-renders the fixture, which uses `%` and only `%`.
      # It therefore does NOT validate a symbol somebody just added (roborev 4611) — that is
      # `ucum_display_symbols_are_inert_in_a_hovertemplate` in dictionary.rs, a browser-free
      # check over the WHOLE table that runs in every job. Keep this entry for the `%` case
      # the browser does cover; do not read it as protecting the rest of the table.
      - 'src/cmd/describegpt/dictionary.rs'
      - '.github/workflows/rust-viz-static.yml'
  schedule:
    # weekly, so driver/browser drift is caught even when viz.rs is untouched
    - cron: '37 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-linux-viz-static-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  viz-static:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v7
    # Chrome and chromedriver MUST be a matched pair — a mismatch fails at runtime with
    # "Failed to extract static image from browser session", which reads like a code bug.
    # setup-chrome + setup-chromedriver pin them together.
    - name: Install Chrome + matching chromedriver
      id: chrome
      uses: browser-actions/setup-chrome@v2
      with:
        install-chromedriver: true
        install-dependencies: true
    - name: Report browser/driver versions
      run: |
        echo "chrome:       ${{ steps.chrome.outputs.chrome-path }} (${{ steps.chrome.outputs.chrome-version }})"
        echo "chromedriver: ${{ steps.chrome.outputs.chromedriver-path }} (${{ steps.chrome.outputs.chromedriver-version }})"
        # the runner also ships its OWN Chrome; print it so a future mismatch is obvious in the log
        (/opt/google/chrome/chrome --version || true) 2>/dev/null | sed 's/^/system chrome: /'
    - name: Installing Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        targets: x86_64-unknown-linux-gnu
    - name: Setup Rust-cache
      uses: Swatinem/rust-cache@v2
      with:
        key: qsv-viz-static-cache
    # feature_capable + viz_static only — `all_features` would drag in python, magika,
    # self_update and ui for no benefit on a job that already carries webdriver latency.
    # The hover rendering-contract test (issue #4557) drives a browser itself rather than going
    # through plotly's exporter, so it must be told WHICH Chrome to launch. Installing a matched
    # pair is not enough on its own: chromedriver otherwise starts the runner's pre-installed
    # /opt/google/chrome/chrome and reports a version mismatch against a correctly matched driver.
    # The other viz_static tests are unaffected — plotly_static fetches its own matched driver.
    - name: Run the browser-gated viz tests
      env:
        QSV_TEST_CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        QSV_TEST_CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
      run: cargo test --verbose --locked --features=feature_capable,viz_static viz_static -- --ignored --test-threads=1
