name: Windows - ARM64

on:
  # push:
  #   branches: [ master ]
  # pull_request:
  #   branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ci-windows-arm-tests-${{ github.ref }}-1
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Least privilege: the repo's default GITHUB_TOKEN permission is write.
permissions:
  contents: read

jobs:
  build:
    # Skip CI for MCP-only commits (commit message contains "(mcp):")
    if: |
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '(mcp):')

    runs-on: windows-11-arm
    # Hard cap so a hung test (e.g. flaky streaming-URL sample tests) fails fast
    # instead of burning the 6-hour GitHub default. Normal runs finish in ~45 min.
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Installing Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-29
      with:
        toolchain: stable
    - name: Setup Rust-cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: qsv-winarm64cache
    - name: make empty DLLs directory to prevent spurious python warning
      run: |
        mkdir DLLs   
    - name: Run tests
      env:
          RUSTFLAGS: -C debuginfo=0
      #   RUSTFLAGS: -C target-cpu=native
      # Windows: jemallocator is not supported on Windows, so we use the system allocator.
      run: cargo test --verbose --locked --no-default-features --features=apply,fetch,foreach,luau,python,polars,feature_capable,ui
