name: Linux

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ci-linux-tests-${{ github.ref }}-1
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # Skip CI for MCP-only commits (commit message contains "(mcp):")
    if: |
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '(mcp):')

    runs-on: ubuntu-latest
    # Hard cap so a hung test fails fast instead of burning the 6-hour GitHub default.
    timeout-minutes: 90

    steps:
    - name: apt-get update Ubuntu, libwayland-dev
      run: |
        sudo apt-get update
        sudo apt-get install libwayland-dev
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Install and Run Redis
      run: |
        sudo apt-get install redis-server
        sudo service redis-server start
    - name: Installing Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        targets: x86_64-unknown-linux-gnu
    - name: Setup Rust-cache
      uses: Swatinem/rust-cache@v2
      with:
        key: qsv-linuxcache
    # - uses: actions/cache@v4
    #   with:
    #     path: |
    #       ~/.cargo/bin/
    #       ~/.cargo/registry/index/
    #       ~/.cargo/registry/cache/
    #       ~/.cargo/git/db/
    #       target/
    #     key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Run tests
      # env:
        # RUSTFLAGS: -C target-cpu=native
      # `viz_static` (not plain `viz`) so the browser-gated tests in tests/test_viz.rs are at least
      # COMPILED and type-checked here. They stay `#[ignore]`d, so no webdriver is needed. Before
      # this, `viz_static` appeared in no test workflow at all and those tests were never even
      # checked — which is how their fixtures silently rotted (issues #4221 / #4343).
      # Actually RUNNING them needs a browser; that is the rust-viz-static.yml workflow.
      run: cargo test --verbose --locked --features=apply,fetch,foreach,geocode,luau,python,feature_capable,lens,magika,color,viz_static,mcp
    # Windows gives the main thread 1 MB of stack and debug frames are not collapsed, so a
    # stack-usage regression in `viz smart` breaks every Windows debug test run (issue #4328).
    # Encode that constraint on every PR by running the debug binary under a 1 MB rlimit here.
    - name: viz smart 1 MB stack smoke test
      run: (ulimit -s 1024; ./target/debug/qsv viz smart examples/viz/customer_spend.csv -o /tmp/viz_smart_1mb.html)
