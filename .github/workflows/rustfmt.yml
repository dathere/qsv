name: Rustfmt

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Least privilege: the repo's default GITHUB_TOKEN permission is write.
permissions:
  contents: read

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-29
      with:
        toolchain: nightly
        components: rustfmt, clippy
    - name: make doubly sure right rustfmt is installed
      run: |
        rustup default nightly
        rustup component add rustfmt
        rustup update
    # actions-rs/cargo is archived/Node20-deprecated (qsv #4002), so invoke cargo directly.
    - name: Check formatting
      run: cargo +nightly fmt -- --check
