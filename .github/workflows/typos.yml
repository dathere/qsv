name: Typos Check
on:
  pull_request:
  workflow_dispatch:
  
jobs:
  run:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Actions Repository
      uses: actions/checkout@v7

    - name: Check spelling
      uses: crate-ci/typos@b41eb62e9a8096c9ba6636e2365d3f56018a203c # master @ 2026-10-29
      with:
        config: ./_typos.toml
