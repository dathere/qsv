[default]
extend-ignore-identifiers-re = ["wrk", "flate", "ND", "typ", "ful"]

[default.extend-identifiers]
# typos in third-party code/libraries
WrittingCSV = "WrittingCSV"
seperator   = "seperator"

[default.extend-words]
# these are false positives in data/examples
ALLE          = "ALLE"
ba            = "ba"
Environnement = "Environnement"
fo            = "fo"
hel           = "hel"
inout         = "inout"
UE            = "UE"
seeked        = "seeked"
DNE           = "DNE"
Generice      = "Generice"
Portugese     = "Portugese"
ACI           = "ACI"
consts        = "consts"
Caf           = "Caf"
unparseable   = "unparseable"
mis           = "mis"
nd            = "nd"
Pn            = "Pn"
tripel        = "tripel"
sems          = "sems"
# Spanish for "annual" — "reunión anual" in a describegpt language-detection fixture
anual         = "anual"
# Unaccented "português", an accepted `--language` alias in viz_i18n::LOCALES. Mirrors the
# "espanol"/"español" pair already there: a user who cannot type the diacritic still gets a hit.
portugues     = "portugues"

[files]
extend-exclude = [
    "*.csv",
    "*.geojson",
    "*.ipynb",
    "*.jsonl",
    "*.lua",
    "*.pynb",
    "*.ssv",
    "*.tab",
    "*.js",
    "*.ts",
    "nyc311-describegpt*.*",
    "docs/describegpt/*",
    "docs/whirlwind_tour.md",
    "*.py",
    "test_clean.rs",
    "examples/viz/*.html",
    "src/cmd/assets/i18n/*",
    "src/cmd/locales/*",
    "tests/test_viz.rs",
    "src/cmd/viz.rs",
]
