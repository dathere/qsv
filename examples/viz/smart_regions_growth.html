<style>
  /* effective drawer height: the grip persists --qsv-data-h in absolute px, so re-clamp it in
     CSS against the CURRENT viewport — a later window resize / device rotation can otherwise
     leave the persisted value outside the 20vh-90vh bounds. Every consumer (drawer height,
     body margin, fixed-widget pushes) uses this one clamped var so they can never disagree. */
  /* --qsv-data-vh is one vh worth of px. It defaults to the real thing, so a standalone page
     behaves exactly as if the vh unit were used directly; an EMBEDDED page has the parent
     overwrite it with a hundredth of the parent's viewport (see the qsvVizViewport handshake).
     That indirection exists because vh inside an auto-sized iframe resolves against the IFRAME,
     which the gallery has grown to the dashboard's full content height — so "55vh" meant 55% of
     the whole document and the drawer opened far taller than the window it had to fit in. */
  /* declared on :root, NOT on the body rule below — the handshake writes this var to
     documentElement's inline style (as --qsv-data-h already does), and re-declaring it on body
     would beat that inherited value and silently pin every page back to the default */

  body { --qsv-data-h-eff: clamp(calc(20 * var(--qsv-data-vh)), var(--qsv-data-h, min(calc(55 * var(--qsv-data-vh)), 560px)), calc(90 * var(--qsv-data-vh))); }
  #qsv-data-drawer { position: fixed; left: 0; right: 0; bottom: 0; height: var(--qsv-data-h-eff); transform: translateY(103%); transition: transform 0.22s ease; z-index: 1120; display: flex; flex-direction: column; color: var(--qsv-page-ink, #1a1a1a); background: var(--qsv-page-bg, #ffffff); border-top: 1px solid rgba(127, 127, 127, 0.4); box-shadow: 0 -4px 18px rgba(0, 0, 0, 0.18); }
  #qsv-data-drawer.open { transform: none; }
  #qsv-data-drawer:focus { outline: none; }
  .qsv-data-drawer-grip { flex: none; height: 10px; cursor: ns-resize; touch-action: none; display: flex; align-items: center; justify-content: center; }
  .qsv-data-drawer-grip::before { content: ""; width: 44px; height: 4px; border-radius: 2px; background: rgba(127, 127, 127, 0.55); }
  .qsv-data-drawer-bar { display: flex; align-items: center; justify-content: space-between; padding: 0 14px 6px; font-size: 13px; font-weight: 600; border-bottom: 1px solid rgba(127, 127, 127, 0.25); }
  .qsv-data-drawer-bar a { color: inherit; text-decoration: none; font-weight: 400; font-size: 15px; opacity: 0.75; }
  .qsv-data-drawer-bar a:hover { opacity: 1; }
  .qsv-data-drawer-content { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 4px 14px 10px 14px; }
  /* only the table's own layout row scrolls; the controls row above and the info/paging row

  #qsv-data-drawer div.dt-container { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #qsv-data-drawer div.dt-container > div.dt-layout-row { flex: none; }

     scrollport, which puts half the overflow ABOVE it — unreachable by scrolling, so the
     first rows sit hidden behind the sticky thead */

  /* Under scrollX the header is no longer inside the body table: DataTables lifts it into its
     own `div.dt-scroll-head` sitting above `div.dt-scroll-body`, and keeps the two aligned by
     mirroring the body's horizontal scroll onto the head. So the head handles the horizontal
     axis itself — but only the body scrolls, and the drawer's vertical scroller is the OUTER
     `.dt-layout-table`, which would carry the whole head off the top with it. Pinning the head
     restores a fixed header on the vertical axis while leaving DataTables' horizontal mirroring

     search row) together, with none of the per-row offset measurement that pinning cells
     individually would need.

          // means every column. orthogonal="display" is the fidelity-preserving
          // choice, not "export": Buttons strips markup and decodes entities on the way out,
          // which mangles a raw cell but exactly inverts the escaping DataTable.render.text()
          // applied for display. Over a markup/entity/quote/tab/emoji fixture "display" was
          // 10/10 exact where "export" corrupted 4/10. Row scope is the default too: search
          // applies, paging does not, so the file holds every filtered row, not the page.
          //
          // NOTE: this default is only safe because the DataTables **Select extension is not
          // loaded** (it requires jQuery; see DATATABLES_CDN_COMBO). With Select present, Buttons
          // silently narrows the export to "the selected rows, if any" — so if it is ever added,
          // this button MUST pin `exportOptions.modifier.selected = null`. The hand-rolled row
          // selection below deliberately does not hook Buttons, so the export stays all-rows.
          exportOptions: {
            // csvHtml5 carries this in its OWN default exportOptions, and supplying the object
            // replaces that default rather than merging into it. Restated so the CSV-injection
            // guard (a leading =, +, - or @ in a cell) cannot be lost by accident.
            escapeExcelFormula: true,
            // The thead has TWO rows — the titles and ColumnControl's search row — and the CSV
            // writer serializes every row of headerStructure, so the search row lands in the
            // file as a blank line between the header and the first record. Drop it.
            //
            // Matched on `data-dt-order="disable"`, which ColumnControl sets on the row it
            // creates (that row must not attach ordering handlers). That is a semantic marker
            // rather than a row index or an emptiness test, so it keeps working if the header
            // gains further rows. Note this hook belongs to exportData's options, NOT to the
            // button config: sitting a level up it is silently never called.
            customizeData: function (d) {
              if (!d.headerStructure) return;
              d.headerStructure = d.headerStructure.filter(function (row) {
                return !row.some(function (c) {
                  return c.cell && c.cell.parentNode &&
                    c.cell.parentNode.getAttribute("data-dt-order") === "disable";
                });
              });
            }
          }
        }] }] }
      });
      // Row selection, "os" idiom: plain click replaces the selection (and clicking the only
      // selected row clears it), ctrl/cmd-click toggles one row, shift-click extends a range.
      // Delegated from the table so it keeps working as deferRender recycles row nodes, and
      // scoped to tbody so the ColumnControl search row in the thead is untouched.
      table.addEventListener("click", function (ev) {
        var tr = ev.target.closest("tbody tr");
        if (!tr || !dt || !table.contains(tr)) return;
        var idx = dt.row(tr).index();
        // the "no matching records" placeholder is a tbody tr with no backing data row
        if (idx === undefined || idx === null) return;
        if (ev.shiftKey && selAnchor !== null) {
          // range over the CURRENT sort+filter, so it matches what the user sees
          var order = dt.rows({order: "applied", search: "applied"}).indexes().toArray();
          var a = order.indexOf(selAnchor), b = order.indexOf(idx);
          if (a >= 0 && b >= 0) {
            selRows.clear();
            for (var i = Math.min(a, b); i <= Math.max(a, b); i++) selRows.add(order[i]);
          }

          // range reads as a row selection rather than a smear of highlighted text
          var ws = window.getSelection();

          if (selRows.has(idx)) selRows.delete(idx); else selRows.add(idx);
          selAnchor = idx;
        } else {
          var onlyThis = selRows.size === 1 && selRows.has(idx);
          selRows.clear();
          if (!onlyThis) selRows.add(idx);
          selAnchor = idx;
        }
        selectionChanged("rows");
      });
      // deferRender builds row nodes on demand and every draw re-writes the tbody, so the
      // `selected` class has to be re-applied rather than set once at click time.
      dt.on("draw", function () { paintSelection(); paintSelectionInfo(); });
      // Publish the table for the map<->rows selection bridge. The drawer is built LAZILY on
      // first open, so a bridge that merely read `window.__qsvDataDT` at page load would always
      // find nothing — it listens for this event instead (and re-checks the global, in case it
      // hooked after the drawer was already built).
      window.__qsvDataDT = dt;
      document.dispatchEvent(new CustomEvent("qsv-data-dt-ready"));
      // let the just-appended drawer paint once closed, so the open transition animates
      requestAnimationFrame(function () { show(drawer); });
    });
  }
  window.qsvOpenData = function () {
    var drawer = document.getElementById("qsv-data-drawer");
    if (drawer) { show(drawer); return false; }
    var lib = document.getElementById("qsv-data-lib");
    var gz = (lib && lib.getAttribute("type") === "application/gzip-b64") ||
      document.getElementById("qsv-data-rows").getAttribute("type") === "application/gzip-b64";
    if (gz && !window.DecompressionStream) {
      if (window.__qsvNoDecompress) window.__qsvNoDecompress();
      return false;
    }
    build().catch(function (e) { console.error("qsv viz: data viewer failed:", e); });
    return false;
  };
  // Flash a short message in the drawer bar for ~2s. Used by the map<->rows bridge to explain a
  // click that could not do anything visible (a map point whose row lies past the preview
  // prefix). A no-op before the drawer is built, so callers need no guard.
  var noteTimer = null;
  window.__qsvDataNote = function (msg) {
    var el = document.getElementById("qsv-data-note");
    if (!el) return;
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(noteTimer);
    noteTimer = setTimeout(function () { el.classList.remove("show"); }, 2000);
  };
  window.qsvCloseData = function () {
    var drawer = document.getElementById("qsv-data-drawer");
    if (drawer) drawer.classList.remove("open");
    document.body.classList.remove("qsv-data-open");
    window.dispatchEvent(new Event("resize"));
    // return focus to the Explore/Preview link in the metadata table — the top of the
    // dashboard — which also scrolls it back into view
    var link = document.querySelector("a.qsv-data-link");
    if (link) {
      link.focus();
      // embedded: scroll the parent back to the top of this dashboard (see revealTop)
      revealTop(link);
    }
    return false;
  };
  // Esc closes the data drawer; the dictionary drawer registers its own Esc handler, so with
  // both open a single Esc closes both — acceptable, they are independent overlays.
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") {
      // an open Buttons popover (the SearchBuilder "Filter" panel) owns this Esc — Buttons
      // dismisses it itself; only a bare Esc closes the drawer
      if (document.querySelector("div.dt-button-collection")) return;
      var drawer = document.getElementById("qsv-data-drawer");
      if (drawer && drawer.classList.contains("open")) window.qsvCloseData();
    }
  });
})();
</script>


<script>
(function () {
  var themeDefaultMode = "system";
  var DARK = { paper: "#111111", plot: "#111111", font: "#f2f5fa", grid: "#283442", line: "#506784", zero: "#283442", bg: "#111111", land: "#2a3138", water: "#16202b", mapStyle: "carto-darkmatter", mapStyleNoLabels: "carto-darkmatter-nolabels" };
  var LIGHT = { paper: "#FFFFFF", plot: "#FFFFFF", font: "#2A3F5F", grid: "#ECECEC", line: "#BCC4CE", zero: "#ECECEC", bg: "#FFFFFF", land: "#d3d3d3", water: "#add8e6", mapStyle: "carto-positron", mapStyleNoLabels: "carto-positron-nolabels" };
  function isDark() {
    // An explicit --theme is authoritative: it wins over a stale cross-dashboard
    // saved preference (the localStorage key is shared across all qsv viz pages,
    // so a "light" toggle on one dashboard must not override --theme plotly_dark
    // on another).
    if (themeDefaultMode === "dark") return true;
    if (themeDefaultMode === "light") return false;
    // No --theme: defer to the viewer's saved choice, then OS preference.
    try {
      var saved = localStorage.getItem("qsv-viz-theme");
      if (saved === "dark") return true;
      if (saved === "light") return false;
    } catch (e) {}
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function buildUpdate(gd, p) {
    var u = { "paper_bgcolor": p.paper, "font.color": p.font };
    var lay = gd.layout || {};
    var hasAxis = false;
    Object.keys(lay).forEach(function (k) {
      if (/^xaxis\d*$/.test(k) || /^yaxis\d*$/.test(k)) {
        hasAxis = true;
        u[k + ".gridcolor"] = p.grid;
        u[k + ".linecolor"] = p.line;
        u[k + ".zerolinecolor"] = p.zero;
        u[k + ".tickcolor"] = p.line;
      }
      if (/^geo\d*$/.test(k)) {
        u[k + ".bgcolor"] = p.bg;
        u[k + ".landcolor"] = p.land;
        u[k + ".oceancolor"] = p.water;
        u[k + ".lakecolor"] = p.water;
      } else if (/^map\d*$/.test(k)) {
        // preserve a panel's labeled-vs-nolabels choice: density/choropleth overlays use the
        // label-free basemap, point maps keep labels. Swap only the theme, not the labeling.
        var curStyle = lay[k] && lay[k].style;
        var noLabels = typeof curStyle === "string" && /-nolabels$/.test(curStyle);
        u[k + ".style"] = noLabels ? p.mapStyleNoLabels : p.mapStyle;
      } else if (/^polar\d*$/.test(k) || /^scene\d*$/.test(k)) {
        u[k + ".bgcolor"] = p.bg;
      }
    });
    if (hasAxis) u["plot_bgcolor"] = p.plot;
    return u;
  }
  function hasMapLibre(gd) {
    // Any MapLibre `map`-subplot trace (choroplethmap/densitymap/scattermap) throws on a
    // relayout/react in our pinned plotly fork, so these must take the Plotly.newPlot path below.
    return (gd.data || []).some(function (t) {
      return t.type === "choroplethmap" || t.type === "densitymap" || t.type === "scattermap";
    });
  }
  // Apply a flat dotted-key update (buildUpdate's shape) onto a nested layout, in place — so the
  // same update can feed Plotly.newPlot (which wants nested layout) instead of relayout.
  function setPath(obj, path, val) {
    var parts = path.split("."), o = obj;
    for (var i = 0; i < parts.length - 1; i++) {
      if (o[parts[i]] == null || typeof o[parts[i]] !== "object") o[parts[i]] = {};
      o = o[parts[i]];
    }
    o[parts[parts.length - 1]] = val;
  }
  function apply(dark) {
    document.body.classList.toggle("qsv-dark", dark);
    var p = dark ? DARK : LIGHT;
    document.querySelectorAll(".js-plotly-plot").forEach(function (gd) {
      var u = buildUpdate(gd, p);
      try {
        if (hasMapLibre(gd)) {
          // A MapLibre map trace (choroplethmap/densitymap/scattermap) throws "setData of
          // undefined" on a relayout/react in our pinned plotly fork, so fold the theme update
          // (incl. the basemap `.style`) into a full Plotly.newPlot — the only primitive that
          // safely restyles it without blanking the layer. Preserve the injected fullscreen
          // modebar button via the div's existing config.
          Object.keys(u).forEach(function (k) { setPath(gd.layout, k, u[k]); });
          // Re-theme any "Basemap labels" toggle: its baked `map.style` args point at the
          // render-time theme's basemap, so rewrite each to the target theme's variant, preserving
          // the arg's own `-nolabels` suffix (labeled arg -> mapStyle, no-labels arg ->
          // mapStyleNoLabels). Guarded on the `map.style` key so non-map menus are untouched.
          (gd.layout.updatemenus || []).forEach(function (menu) {
            (menu.buttons || []).forEach(function (b) {
              ["args", "args2"].forEach(function (ak) {
                var a = b[ak];
                if (a && a[0] && typeof a[0]["map.style"] === "string") {
                  a[0]["map.style"] = /-nolabels$/.test(a[0]["map.style"]) ? p.mapStyleNoLabels : p.mapStyle;
                }
              });
            });
          });
          // preserve the page-scroll-friendly scrollZoom state across a theme flip (a MapLibre
          // theme change re-runs newPlot, which would otherwise reset scrollZoom to its map default).
          var cfg = { responsive: true, scrollZoom: document.fullscreenElement === gd };
          var add = gd._context && gd._context.modeBarButtonsToAdd;
          if (add && add.length) cfg.modeBarButtonsToAdd = add;
          var np = Plotly.newPlot(gd, gd.data, gd.layout, cfg);
          // plotly re-enables the MapLibre GL wheel-zoom handler on this newPlot, so re-assert the
          // inline/fullscreen scrollZoom state via the fullscreen script's published helper.
          if (window.__qsvRefitScrollZoom) window.__qsvRefitScrollZoom(gd);
          // that newPlot also builds a NEW MapLibre instance, dropping the cluster label repaint
          // and hover handlers with the old one — re-install them on the new map.
          if (window.__qsvRefitClusterUi) window.__qsvRefitClusterUi(gd);
          // this newPlot re-render silently drops gd.on listeners — rebind the Data Dictionary
          // annotation hook (when that feature is on the page) once the re-render settles,
          // fulfilled OR rejected: the listeners are already gone either way.
          if (gd.__qsvDictHooked && window.__qsvDictRehook && np && np.then) {
            var rehook = function () { gd.__qsvDictHooked = false; window.__qsvDictRehook(); };
            np.then(rehook, rehook);
          }
          // same for the --photos hover-dwell lightbox (see PHOTO_CHROME): its plotly_hover
          // listener went with the old plot, so rebind it once the re-render settles.
          if (gd.__qsvPhotoHooked && window.__qsvPhotoRehook && np && np.then) {
            var prehook = function () { gd.__qsvPhotoHooked = false; window.__qsvPhotoRehook.tries = 0; window.__qsvPhotoRehook(); };
            np.then(prehook, prehook);
          }
          // and for the map<->rows selection bridge (see MAP_SELECT_CHROME): this newPlot drops
          // its plotly_click listener AND repaints the points unselected, so the rehook also
          // re-applies the current selection.
          if (gd.__qsvSelHooked && window.__qsvSelRehook && np && np.then) {
            var srehook = function () { gd.__qsvSelHooked = false; window.__qsvSelRehook.tries = 0; window.__qsvSelRehook(); };
            np.then(srehook, srehook);
          }
        } else {
          Plotly.relayout(gd, u);
        }
      } catch (e) {}
    });
  }
  function init() {
    var dark = isDark();
    apply(dark);
    var btn = document.getElementById("qsv-theme-toggle");
    if (btn) btn.addEventListener("click", function () {
      var nowDark = !document.body.classList.contains("qsv-dark");
      try { localStorage.setItem("qsv-viz-theme", nowDark ? "dark" : "light"); } catch (e) {}
      apply(nowDark);
    });
    // on a compressed page, panels render only after the async plotly.js/figure inflation —
    // AFTER the apply(dark) above ran (it only reaches already-rendered .js-plotly-plot divs).
    // Re-apply on the bootstrap's ready event, debounced since every completed panel fires it.
    var reT;
    document.addEventListener("qsv:plotly-ready", function () {
      clearTimeout(reT);
      reT = setTimeout(function () { apply(document.body.classList.contains("qsv-dark")); }, 60);
    });
  }
  if (document.readyState === "loading")
    document.addEventListener("DOMContentLoaded", function () { setTimeout(init, 0); });
  else setTimeout(init, 0);
})();
</script>
