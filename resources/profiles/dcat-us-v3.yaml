# DCAT-US v3 projection profile
#
# Mirrors the legacy hardcoded dcat.rs engine (replaced commit-by-commit
# across the YAML-driven projection migration). Field order, vocabularies,
# fallback chains, and severity tags are byte-equivalent to the legacy
# output — locked by the golden parity tests under
# tests/resources/profile/golden/.
#
# Spec references (cross-checked against):
#   * https://github.com/GSA/dcat-us/
#   * https://resources.data.gov/resources/dcat-us3/
#   * The vendored GSA bundle under resources/dcat-us-v3/
#
# When editing this file, bump the `version:` field semver-style and
# re-run the golden parity tests. CI hard-fails on drift.

name: dcat-us-v3
version: 4.0.0
about: DCAT-US v3 metadata projection (resources.data.gov)
about_url: https://resources.data.gov/resources/dcat-us3/

# =========================================================================
# Named vocabularies
# =========================================================================
# Lookup tables exposed to templates via `lookup("table", key)`. Tables are
# case-insensitive; for RFC 5646 language tags the helper strips subtags
# (en-US → en) before the lookup.

vocabularies:
  # CKAN license slug → canonical IRI. http:// scheme is deliberate per
  # the CC / ODC canonical identifiers (changing to https:// breaks
  # round-tripping with DCAT consumers).
  license_iri:
    cc-by:     "http://creativecommons.org/licenses/by/4.0/"          # DevSkim: ignore DS137138
    cc-by-sa:  "http://creativecommons.org/licenses/by-sa/4.0/"       # DevSkim: ignore DS137138
    cc-zero:   "http://creativecommons.org/publicdomain/zero/1.0/"    # DevSkim: ignore DS137138
    odc-by:    "http://opendatacommons.org/licenses/by/1.0/"          # DevSkim: ignore DS137138
    odc-pddl:  "http://opendatacommons.org/licenses/pddl/1.0/"        # DevSkim: ignore DS137138

  # CKAN frequency slug → DCAT-US v3 frequency code.
  #
  # GSA Dataset.json constrains `accrualPeriodicity` to a STRING from one
  # of three vocabularies — ISO 19115 maintenance-frequency codes, the
  # Dublin Core collection-frequency terms, or an ISO-8601 `R/P...`
  # recurrence. It does NOT accept an object, so the `{"@id": <IRI>}`
  # form this table used to emit matched none of the branches and failed
  # validation. The publications.europa.eu IRIs are a DCAT-AP (EU)
  # convention and remain correct in dcat-ap-v3.yaml — they are simply
  # not valid here.
  #
  # Targets below are ISO 19115 codes except `bimonthly`/`semimonthly`,
  # which only exist in the Dublin Core list. Unrecognized slugs pass
  # through verbatim so an already-valid code or `R/P1Y` still works.
  accrual_periodicity:
    continual:      continual
    continuous:     continual
    realtime:       continual
    "real-time":    continual
    daily:          daily
    "r/p1d":        daily
    weekly:         weekly
    "r/p7d":        weekly
    "r/p1w":        weekly
    fortnightly:    fortnightly
    biweekly:       fortnightly
    "r/p14d":       fortnightly
    "r/p2w":        fortnightly
    monthly:        monthly
    "r/p1m":        monthly
    bimonthly:      bimonthly
    "r/p2m":        bimonthly
    semimonthly:    semimonthly
    quarterly:      quarterly
    "r/p3m":        quarterly
    biannually:     biannually
    semiannual:     biannually
    biannual:       biannually
    "r/p6m":        biannually
    annually:       annually
    annual:         annually
    yearly:         annually
    "r/p1y":        annually
    asneeded:       asNeeded
    "as-needed":    asNeeded
    irregular:      irregular
    notplanned:     notPlanned
    "not-planned":  notPlanned
    unknown:        unknown

  # Free-text language → ISO 639-1 2-letter code. Both 2-letter codes and
  # English names are accepted; RFC 5646 subtags (en-US) are stripped by
  # the lookup helper before matching.
  iso_639_1:
    en:           en
    english:      en
    es:           es
    spanish:      es
    fr:           fr
    french:       fr
    de:           de
    german:       de
    it:           it
    italian:      it
    pt:           pt
    portuguese:   pt
    nl:           nl
    dutch:        nl
    ja:           ja
    japanese:     ja
    ko:           ko
    korean:       ko
    zh:           zh
    chinese:      zh
    ru:           ru
    russian:      ru
    ar:           ar
    arabic:       ar
    hi:           hi
    hindi:        hi

  # qsv stats type → CSVW datatype IRI. Used by csvw:tableSchema's
  # per-column datatype slot.
  csvw_datatype:
    String:        "string"
    Integer:       "integer"
    Float:         "decimal"
    Date:          "date"
    DateTime:      "dateTime"
    NULL:          "string"

# =========================================================================
# CKAN → DCAT pointer mappings (force-override + warning-filter use only)
# =========================================================================
# Same 56 entries the legacy ckan_to_dcat::CKAN_TO_DCAT table held, in the
# same declaration order so aliases like `package.url` vs
# `package.landing_page` resolve identically.

field_mappings:
  # add_core_identity (package → Dataset top-level)
  - { ckan: "/package/title",                target: "/projection/title" }
  - { ckan: "/package/notes",                target: "/projection/description" }
  - { ckan: "/package/name",                 target: "/projection/identifier" }
  - { ckan: "/package/metadata_created",     target: "/projection/issued" }
  - { ckan: "/package/metadata_modified",    target: "/projection/modified" }
  - { ckan: "/package/created",              target: "/projection/created" }
  # add_provenance
  - { ckan: "/package/publisher",            target: "/projection/publisher" }
  - { ckan: "/package/author",               target: "/projection/publisher" }
  # add_contact_point (composite — scalar parts not independently forceable)
  - { ckan: "/package/contact_point",        target: "/projection/contactPoint" }
  # add_classification
  - { ckan: "/package/tags",                 target: "/projection/keyword" }
  - { ckan: "/package/groups",               target: "/projection/theme" }
  # add_governance
  - { ckan: "/package/language",             target: "/projection/language" }
  - { ckan: "/package/accrualPeriodicity",   target: "/projection/accrualPeriodicity" }
  - { ckan: "/package/frequency",            target: "/projection/accrualPeriodicity" }
  - { ckan: "/package/update_frequency",     target: "/projection/accrualPeriodicity" }
  - { ckan: "/package/dcat-us:accessLevel",  target: "/projection/dcat-us:accessLevel" }
  - { ckan: "/package/access_level",         target: "/projection/dcat-us:accessLevel" }
  # add_us_codes
  - { ckan: "/package/bureauCode",           target: "/projection/dcat-us:bureauCode" }
  - { ckan: "/package/programCode",          target: "/projection/dcat-us:programCode" }
  # add_extended_metadata
  - { ckan: "/package/landing_page",         target: "/projection/landingPage" }
  - { ckan: "/package/url",                  target: "/projection/landingPage" }
  - { ckan: "/package/data_dictionary",      target: "/projection/describedBy" }
  - { ckan: "/package/describedBy",          target: "/projection/describedBy" }
  - { ckan: "/package/rights",               target: "/projection/rights" }
  - { ckan: "/package/accessRights",         target: "/projection/accessRights" }
  - { ckan: "/package/access_rights",        target: "/projection/accessRights" }
  - { ckan: "/package/purpose",              target: "/projection/purpose" }
  - { ckan: "/package/scopeNote",            target: "/projection/scopeNote" }
  - { ckan: "/package/scope_note",           target: "/projection/scopeNote" }
  - { ckan: "/package/liabilityStatement",   target: "/projection/liabilityStatement" }
  - { ckan: "/package/liability_statement",  target: "/projection/liabilityStatement" }
  - { ckan: "/package/temporalResolution",   target: "/projection/temporalResolution" }
  - { ckan: "/package/version",              target: "/projection/version" }
  - { ckan: "/package/versionNotes",         target: "/projection/versionNotes" }
  - { ckan: "/package/version_notes",        target: "/projection/versionNotes" }
  # build_distribution (resource → Distribution[0])
  - { ckan: "/resource/name",                target: "/projection/distribution/0/title" }
  - { ckan: "/resource/description",         target: "/projection/distribution/0/description" }
  - { ckan: "/resource/url",                 target: "/projection/distribution/0/downloadURL" }
  - { ckan: "/resource/accessURL",           target: "/projection/distribution/0/accessURL" }
  - { ckan: "/resource/format",              target: "/projection/distribution/0/format" }
  - { ckan: "/resource/mediaType",           target: "/projection/distribution/0/mediaType" }
  - { ckan: "/resource/license_id",          target: "/projection/distribution/0/license" }
  - { ckan: "/resource/license",             target: "/projection/distribution/0/license" }
  - { ckan: "/resource/last_modified",       target: "/projection/distribution/0/modified" }
  - { ckan: "/resource/modified",            target: "/projection/distribution/0/modified" }
  - { ckan: "/resource/rights",              target: "/projection/distribution/0/rights" }
  - { ckan: "/resource/language",            target: "/projection/distribution/0/language" }
  - { ckan: "/resource/conformsTo",          target: "/projection/distribution/0/conformsTo" }
  - { ckan: "/resource/access_restriction",  target: "/projection/distribution/0/accessRestriction" }
  - { ckan: "/resource/use_restriction",     target: "/projection/distribution/0/useRestriction" }
  - { ckan: "/resource/cui_restriction",     target: "/projection/distribution/0/cuiRestriction" }

# =========================================================================
# Schema validation
# =========================================================================
# When `enabled: true`, dcat_validate.rs loads the JSON Schema bundle from
# `schema_dir` and validates the projection block against `entry_dataset`
# (or `entry_catalog` when `--catalog`). The strippable_curie_prefixes
# list collapses `<prefix>:<localname>` keys for validation so the schema
# (which uses bare local names) sees the right shape.
validation:
  enabled: true
  schema_dir: resources/dcat-us-v3/
  entry_dataset: qsv-overlay-dataset.json
  entry_catalog: qsv-overlay-catalog.json

# =========================================================================
# Dataset projection
# =========================================================================
# Field order here is the legacy add_* function order — drives the
# serde_json::Map insertion order surfaced to consumers.
dataset:
  type: "Dataset"
  fields:
    # ------ add_core_identity ------
    - path: "title"
      template: '{{ pkg.title | default(source_label | basename | file_stem) | default("dataset") }}'
      required_level: required

    - path: "description"
      template: '{{ pkg.notes | default("") }}'
      emit_when: '{{ (pkg.notes | default("")) != "" }}'

    - path: "identifier"
      template: '{{ pkg.name | default("") }}'
      emit_when: '{{ (pkg.name | default("")) != "" }}'

    - path: "issued"
      template: '{{ pkg.metadata_created | default("") }}'
      emit_when: '{{ (pkg.metadata_created | default("")) != "" }}'

    - path: "modified"
      template: '{{ pkg.metadata_modified | default("") | sanitize_iso_8601_interval }}'
      emit_when: '{{ (pkg.metadata_modified | default("")) != "" }}'

    # ------ add_provenance ------
    - path: "publisher"
      template: |
        { "@type": "Organization",
          "name": {{ (pkg.publisher | default(pkg.author | default(""))) | tojson }} }
      emit_when: '{{ (pkg.publisher | default(pkg.author | default(""))) != "" }}'

    # ------ add_contact_point ------
    # Two-tier fallback: explicit contact_point object → maintainer pair.
    # Required-level — drives the well-known "missing contactPoint" warning.
    - path: "contactPoint"
      template: |
        {% if pkg.contact_point and pkg.contact_point.fn and pkg.contact_point.hasEmail -%}
        { "@type": "Kind",
          "fn": {{ pkg.contact_point.fn | tojson }},
          "hasEmail": {{ (pkg.contact_point.hasEmail | format_mailto | string) | tojson }} }
        {%- elif pkg.maintainer and pkg.maintainer_email -%}
        { "@type": "Kind",
          "fn": {{ pkg.maintainer | tojson }},
          "hasEmail": {{ (pkg.maintainer_email | format_mailto | string) | tojson }} }
        {%- endif %}
      required_level: required

    # ------ add_classification ------
    - path: "keyword"
      template: |
        {%- if pkg.tags -%}
        [{% for t in pkg.tags %}{% if not loop.first %},{% endif %}
        {%- if t is string %}{{ t | tojson }}{% else %}{{ (t.name | default(t)) | tojson }}{% endif -%}
        {% endfor %}]
        {%- endif -%}
      emit_when: '{{ pkg.tags is defined and pkg.tags | length > 0 }}'

    - path: "theme"
      template: |
        {%- if pkg.groups -%}
        [{% for g in pkg.groups %}{% if not loop.first %},{% endif %}
        {%- if g.name is defined %}{{ g.name | tojson }}{% else %}{{ g | tojson }}{% endif -%}
        {% endfor %}]
        {%- endif -%}
      emit_when: '{{ pkg.groups is defined and pkg.groups | length > 0 }}'

    # ------ add_coverage ------
    # Spatial: prefer the WKT suggestion from formula evaluation, fall
    # back to the qsv-inferred lat/lon bbox via bbox_from_dpps. Both
    # branches yield an array of Location per DCAT-US v3 cardinality
    # (0..*).
    #
    # The two branches use DIFFERENT Location slots on purpose, and the
    # distinction is semantic, not stylistic:
    #   * a user-supplied `spatial_extent` is an arbitrary geometry, so
    #     it lands in `geometry`;
    #   * bbox_from_dpps only ever derives a bounding rectangle from the
    #     lat/lon column ranges, so it lands in `bbox`.
    # GSA Location.json accepts a bare WKT string for both (the third
    # anyOf branch requires GeoJSON `type`+`coordinates`, which is why
    # the geosparql-typed `@value` object used before v3 conformance is
    # gone — it matched none of the branches).
    #
    # The emit_when guard suppresses the field entirely when neither
    # source is available — without it, bbox_from_dpps returning
    # UNDEFINED renders the string "null" via `| tojson` and
    # coerce_json_or_string keeps it as a literal string, leaving a
    # malformed `"spatial": "null"` in the output (Roborev #2490).
    - path: "spatial"
      template: |
        {%- set wkt = pkg.dpp_suggestions.spatial_extent.value | default("") -%}
        {%- set bbox = bbox_from_dpps(dpp, stats) -%}
        {%- if wkt != "" -%}
        [{
          "@type": "Location",
          "geometry": {{ wkt | tojson }}
        }]
        {%- elif bbox -%}{{ bbox | tojson }}{%- endif -%}
      emit_when: '{{ (pkg.dpp_suggestions.spatial_extent.value | default("")) != "" or bbox_from_dpps(dpp, stats) is defined }}'

    - path: "temporal"
      template: |
        {%- set tp = temporal_from_dpps(dpp, stats) -%}
        {%- if tp -%}{{ tp | tojson }}{%- endif -%}

    # ------ add_us_codes ------
    # bureauCode + programCode are array-typed in DCAT-US v3. CKAN
    # convention also accepts comma-separated strings.
    - path: "dcat-us:bureauCode"
      template: |
        {%- if pkg.bureauCode is string -%}
        [{% for s in pkg.bureauCode.split(',') %}{% if not loop.first %},{% endif %}{{ s | trim | tojson }}{% endfor %}]
        {%- elif pkg.bureauCode -%}
        {{ pkg.bureauCode | tojson }}
        {%- endif -%}
      emit_when: '{{ pkg.bureauCode is defined and pkg.bureauCode | length > 0 }}'
      required_level: recommended

    - path: "dcat-us:programCode"
      template: |
        {%- if pkg.programCode is string -%}
        [{% for s in pkg.programCode.split(',') %}{% if not loop.first %},{% endif %}{{ s | trim | tojson }}{% endfor %}]
        {%- elif pkg.programCode -%}
        {{ pkg.programCode | tojson }}
        {%- endif -%}
      emit_when: '{{ pkg.programCode is defined and pkg.programCode | length > 0 }}'
      required_level: recommended

    # ------ add_governance ------
    - path: "dcat-us:accessLevel"
      template: '{{ pkg["dcat-us:accessLevel"] | default(pkg.access_level | default("public")) }}'

    - path: "conformsTo"
      template: |
        [{ "@type":     "Standard",
           "title":      "DCAT-US 3.0",
           "identifier": "https://resources.data.gov/dcat-us/3.0.0" }]

    - path: "language"
      template: '{{ lookup("iso_639_1", pkg.language | default("")) }}'
      emit_when: '{{ (pkg.language | default("")) != "" }}'

    # --dcat-legacy-license: re-emit dct:license on the Dataset
    # alongside the v3-required Distribution-level copy. Gated on the
    # `legacy_license` flag threaded into projection_ctx by
    # profile.rs::run (Roborev #2490 finding #4). Off by default per
    # strict v3.
    - path: "license"
      template: |
        {%- set raw = (pkg.license_id | default(pkg.license | default(res.license_id | default(res.license | default(""))))) -%}
        {%- if raw != "" -%}{{ lookup("license_iri", raw) | default(raw) }}{%- endif -%}
      emit_when: '{{ legacy_license and (pkg.license_id | default(pkg.license | default(res.license_id | default(res.license | default(""))))) != "" }}'

    # ------ add_extended_metadata ------
    # Migration Step 11: landingPage is a Document object, not a URL
    # string. GSA Document.json makes `title` REQUIRED, so fall back to
    # the dataset title when the user supplies no page title of its own.
    - path: "landingPage"
      template: |
        {%- set url = (pkg.landing_page | default(pkg.url | default(""))) | only_if_absolute_iri -%}
        {%- if url -%}
        { "@id":   {{ url | tojson }},
          "@type": "Document",
          "title": {{ (pkg.landing_page_title | default(pkg.title | default("Landing Page"))) | tojson }} }
        {%- endif -%}
      emit_when: '{{ ((pkg.landing_page | default(pkg.url | default(""))) | only_if_absolute_iri) != "" }}'

    # Migration Step 8: describedBy is a Distribution object describing
    # the data dictionary, not a plain URL. `describedByType` is removed
    # upstream and folded into this object's `mediaType`.
    - path: "describedBy"
      template: |
        {%- set url = (pkg.data_dictionary | default(pkg.describedBy | default(""))) | only_if_absolute_iri -%}
        {%- set mt  = (pkg.describedByType | default(pkg.data_dictionary_type | default(""))) -%}
        {%- if url -%}
        { "@id":       {{ url | tojson }},
          "@type":     "Distribution",
          "title":     {{ (pkg.data_dictionary_title | default("Data Dictionary")) | tojson }},
          "accessURL": {{ url | tojson }}
          {%- if mt != "" -%}, "mediaType": {{ mt | tojson }}{%- endif %} }
        {%- endif -%}
      emit_when: '{{ ((pkg.data_dictionary | default(pkg.describedBy | default(""))) | only_if_absolute_iri) != "" }}'

    # Migration Step 7: rights is an ARRAY of free-text statements.
    # A bare string from CKAN is wrapped; a list passes through.
    - path: "rights"
      template: |
        {%- set r = pkg.rights | default("") -%}
        {%- if r is string -%}{%- if r != "" -%}[{{ r | tojson }}]{%- endif -%}
        {%- elif r -%}{{ r | tojson }}{%- endif -%}
      emit_when: '{{ pkg.rights is defined and pkg.rights }}'

    - path: "accessRights"
      template: '{{ (pkg.access_rights | default(pkg.accessRights | default(""))) }}'
      emit_when: '{{ (pkg.access_rights | default(pkg.accessRights | default(""))) != "" }}'

    - path: "purpose"
      template: '{{ pkg.purpose | default("") }}'
      emit_when: '{{ (pkg.purpose | default("")) != "" }}'

    - path: "scopeNote"
      template: '{{ (pkg.scopeNote | default(pkg.scope_note | default(""))) }}'
      emit_when: '{{ (pkg.scopeNote | default(pkg.scope_note | default(""))) != "" }}'

    - path: "liabilityStatement"
      template: '{{ (pkg.liabilityStatement | default(pkg.liability_statement | default(""))) }}'
      emit_when: '{{ (pkg.liabilityStatement | default(pkg.liability_statement | default(""))) != "" }}'

    # Migration Step 1: accrualPeriodicity is a frequency CODE STRING
    # (ISO 19115 / Dublin Core / `R/P...`), never an IRI object. Known
    # slugs map through the accrual_periodicity vocabulary; anything
    # else passes through verbatim so a caller-supplied valid code or
    # recurrence survives untouched.
    - path: "accrualPeriodicity"
      template: |
        {%- set slug = pkg.accrualPeriodicity | default(pkg.frequency | default(pkg.update_frequency | default(pkg.dpp_suggestions.accrual_periodicity.value | default("")))) -%}
        {%- if slug != "" -%}{{ lookup("accrual_periodicity", slug) | default(slug) }}{%- endif -%}
      emit_when: '{{ (pkg.accrualPeriodicity | default(pkg.frequency | default(pkg.update_frequency | default(pkg.dpp_suggestions.accrual_periodicity.value | default(""))))) != "" }}'

    - path: "temporalResolution"
      template: '{{ pkg.temporalResolution | default(pkg.dpp_suggestions.temporal_resolution.value | default("")) }}'
      emit_when: '{{ (pkg.temporalResolution | default(pkg.dpp_suggestions.temporal_resolution.value | default(""))) != "" }}'

    - path: "created"
      template: '{{ pkg.created | default("") }}'
      emit_when: '{{ (pkg.created | default("")) != "" }}'

    - path: "version"
      template: '{{ pkg.version | default("") }}'
      emit_when: '{{ (pkg.version | default("")) != "" }}'

    - path: "versionNotes"
      template: '{{ (pkg.versionNotes | default(pkg.version_notes | default(""))) }}'
      emit_when: '{{ (pkg.versionNotes | default(pkg.version_notes | default(""))) != "" }}'

# =========================================================================
# Distribution projection
# =========================================================================
# Each Distribution carries file-derived facts (byteSize, checksum,
# compress/package format) plus per-resource fallbacks for license and
# language.
distribution:
  type: "Distribution"
  # The engine's fallback wrapper key is the CURIE `dcat:distribution`
  # (still right for the prefixed profiles); v3 needs it unprefixed.
  path: "distribution"
  fields:
    - path: "title"
      template: '{{ res.name | default(source_label | basename) | default("data.csv") }}'

    - path: "description"
      template: '{{ res.description | default("") }}'
      emit_when: '{{ (res.description | default("")) != "" }}'

    - path: "downloadURL"
      template: '{{ (res.url | default("")) | only_if_absolute_iri }}'
      emit_when: '{{ (res.url | default("")) != "" }}'

    - path: "qsv:sourcePath"
      template: '{{ source_label }}'

    - path: "mediaType"
      template: 'text/csv'

    - path: "format"
      template: '{{ res.format | default("CSV") }}'

    # Legacy license_value emits a plain string (URL or opaque license
    # text) — GSA Distribution.json declares this as a free-form string,
    # not a JSON-LD @id object. Known slugs (cc-by, etc.) resolve to
    # their canonical IRI via the license_iri vocab.
    - path: "license"
      template: |
        {%- set raw = (res.license_id | default(res.license | default(pkg.license_id | default(pkg.license | default(""))))) -%}
        {%- if raw != "" -%}{{ lookup("license_iri", raw) | default(raw) }}{%- endif -%}
      emit_when: '{{ (res.license_id | default(res.license | default(pkg.license_id | default(pkg.license | default(""))))) != "" }}'

    - path: "accessURL"
      template: '{{ (res.accessURL | default("")) | only_if_absolute_iri }}'
      emit_when: '{{ (res.accessURL | default("")) != "" }}'

    # Migration Step 7: rights is an ARRAY (see the Dataset field).
    - path: "rights"
      template: |
        {%- set r = res.rights | default("") -%}
        {%- if r is string -%}{%- if r != "" -%}[{{ r | tojson }}]{%- endif -%}
        {%- elif r -%}{{ r | tojson }}{%- endif -%}
      emit_when: '{{ res.rights is defined and res.rights }}'

    - path: "modified"
      template: '{{ res.last_modified | default(res.modified | default("")) }}'
      emit_when: '{{ (res.last_modified | default(res.modified | default(""))) != "" }}'

    # accessRestriction / useRestriction are ARRAYS of restriction
    # objects (each requiring `restrictionStatus`); cuiRestriction is a
    # SINGLE object requiring `cuiBannerMarking` + `designationIndicator`.
    # qsv cannot infer any of these from a CSV, so the values pass
    # through verbatim from --initial-context — with the one affordance
    # that a lone object supplied for an array-typed slot is wrapped,
    # since that mistake is easy to make and unambiguous to correct.
    # A caller-supplied shape that is still wrong is reported by
    # --validate rather than silently reshaped.
    - path: "accessRestriction"
      template: |
        {%- set r = res.access_restriction -%}
        {%- if r is sequence and r is not string and r is not mapping -%}
        {{ r | tojson }}
        {%- else -%}
        [{{ r | tojson }}]
        {%- endif -%}
      emit_when: '{{ res.access_restriction is defined and res.access_restriction is not none }}'

    - path: "useRestriction"
      template: |
        {%- set r = res.use_restriction -%}
        {%- if r is sequence and r is not string and r is not mapping -%}
        {{ r | tojson }}
        {%- else -%}
        [{{ r | tojson }}]
        {%- endif -%}
      emit_when: '{{ res.use_restriction is defined and res.use_restriction is not none }}'

    - path: "cuiRestriction"
      template: '{{ res.cui_restriction | tojson }}'
      emit_when: '{{ res.cui_restriction is defined and res.cui_restriction is not none }}'

    - path: "language"
      template: '{{ lookup("iso_639_1", res.language | default(pkg.language | default(""))) }}'
      emit_when: '{{ (res.language | default(pkg.language | default(""))) != "" }}'

    - path: "conformsTo"
      template: |
        {%- set ct = res.conformsTo -%}
        {%- if ct is sequence and ct is not string -%}
        [{% for s in ct %}{% if not loop.first %},{% endif %}
        {%- if s is mapping %}{{ s | tojson }}
        {%- else %}{ "@type": "Standard", "identifier": {{ s | tojson }} }{% endif -%}
        {% endfor %}]
        {%- elif ct is mapping -%}
        [{{ ct | tojson }}]
        {%- elif ct -%}
        [{ "@type": "Standard", "identifier": {{ ct | tojson }} }]
        {%- endif -%}
      emit_when: '{{ res.conformsTo is defined and res.conformsTo }}'

    - path: "byteSize"
      template: '{{ file_size_of(local_path) }}'
      emit_when: '{{ file_size_of(local_path) is defined }}'

    - path: "checksum"
      template: |
        { "@type": "Checksum",
          "algorithm": "SHA-256",
          "checksumValue": {{ sha256_of(local_path) | tojson }} }
      emit_when: '{{ sha256_of(local_path) is defined }}'

    - path: "compressFormat"
      template: '{{ compress_format(local_path) | default(compress_format(source_label)) }}'
      emit_when: '{{ compress_format(local_path) is defined or compress_format(source_label) is defined }}'

    - path: "packageFormat"
      template: '{{ package_format(local_path) | default(package_format(source_label)) }}'
      emit_when: '{{ package_format(local_path) is defined or package_format(source_label) is defined }}'

    - path: "spatialResolutionInMeters"
      template: '{{ pkg.dpp_suggestions.spatial_resolution_in_meters.value | default("") }}'
      emit_when: '{{ (pkg.dpp_suggestions.spatial_resolution_in_meters.value | default("")) != "" }}'

    - path: "csvw:tableSchema"
      template: '{{ build_csvw_schema(stats) | tojson }}'
      emit_when: '{{ stats is defined and stats }}'

# =========================================================================
# Catalog envelope
# =========================================================================
catalog:
  type: "Catalog"
  title_template: '{%- if inner["title"] -%}Catalog of {{ inner["title"] }}{%- else -%}qsv profile catalog{%- endif -%}'
  # The envelope keys default to the CURIE forms (`dct:title`,
  # `dcat:dataset`) for the prefixed profiles; v3 needs them
  # unprefixed, so declare them explicitly.
  title_key: "title"
  dataset_key: "dataset"
  inherit_from_dataset:
    - "publisher"
  # Migration Step 13: the Catalog's conformsTo is a Standard object
  # keyed `identifier` (NOT `@id`), pointing at the version IRI rather
  # than the human-readable docs page. The IRI is an identifier only —
  # it does not dereference, which is expected.
  conforms_to_key: "conformsTo"
  conforms_to: "https://resources.data.gov/dcat-us/3.0.0"
  conforms_to_title: "DCAT-US 3.0"

# =========================================================================
# Discovery merge policy
# =========================================================================
discovery_merge:
  enabled: true
  # Publisher DCAT markup is still overwhelmingly CURIE-keyed JSON-LD
  # (DCAT-US 1.1 / DCAT-AP). v3 is unprefixed, so normalize discovered
  # keys before merging — otherwise a publisher's `dct:title` lands
  # next to our `title` instead of filling it.
  normalize_curies:
    - "dct:"
    - "dcterms:"
    - "dcat:"
    - "foaf:"
    - "vcard:"
    - "skos:"
    - "spdx:"
    - "adms:"
    - "locn:"
  never_overwrite:
    - "@type"
    - "distribution"
  default_strategy: fill-if-absent
  # Per-element merging for the distribution array. Bypasses the
  # `never_overwrite` rule for `dcat:distribution` when enabled and
  # matches each publisher Distribution against an inferred one by
  # `dcat:downloadURL` or `dcat:accessURL`. Matched fields use
  # fill-if-absent so qsv-inferred values (mediaType, byteSize,
  # CSVW schema) always win over publisher overrides.
  distribution_merge:
    enabled: true
    array_key: "distribution"
    identity_keys:
      - "downloadURL"
      - "accessURL"
      - "@id"
    field_strategy: fill-if-absent
    append_unmatched: false
