    # `%{q_why}`) is a FLAG NAME -- all literal.
    regions: "Regionen"
    regions_with: "Regionen (%{q_parts})"
    snap_snapped: "%{q_n} zugeordnet ≤%{q_km} km"
    snap_dropped: "%{q_n} von %{q_total} verworfen, %{q_why}"
