    box_null: "%{q_pct} % Nullwerte"
    box_zeros: "%{q_pct} % Nullen"
    box_right_skewed: "rechtsschief"
    box_left_skewed: "linksschief"
    box_outliers: "%{q_pct} % Ausreißer"
    box_heavy_tails: "schwere Ränder"
