# German (de) -- viz dashboard UI.
# TODO: native-speaker review before release. Umlauts and ß ARE included (this
# file is UTF-8); the pending review is about wording and register, not encoding.
# Keys missing here fall back to en (see `fallback = "en"` in src/main.rs).
