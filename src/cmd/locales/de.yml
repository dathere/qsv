    lorenz_zeros: "flacher Verlauf = %{q_pct} % Nullen, keine kleinen Werte · %{q_unit}"
    funnel_complete: "n = %{q_n} vollständige Fälle (%{q_pct} % der Zeilen)"
    funnel_violation: "%{q_here} übersteigt %{q_prev} in %{q_pct} % der Zeilen"
    funnel_bridge: "Stufen sind nicht ineinander verschachtelt — überbrückt, kein Funnel"
    funnel_inverted: "Summe von %{q_here} übersteigt %{q_prev} — Überläufe, kein Schwund"
    # `--no-snap` and `--snap-max-dist` are FLAG NAMES: keep them verbatim.
    snap_coverage: "%{q_n} von %{q_total} Punkten wurden der nächstgelegenen Region zugeordnet (≤%{q_km} km, %{q_basis})."
    drop_coverage: "%{q_n} von %{q_total} Punkten lagen mehr als %{q_km} km von jeder Region entfernt und wurden verworfen."
    drop_coverage_no_snap: "--no-snap: %{q_n} von %{q_total} Punkten lagen außerhalb aller GeoJSON-Regionen und wurden verworfen."
    snap_basis_explicit: "--snap-max-dist"
    snap_basis_region_precision: "abgeleitet aus Regionsgröße und Koordinatengenauigkeit"
    snap_basis_region: "abgeleitet aus der Regionsgröße"
    snap_basis_precision: "abgeleitet aus der Koordinatengenauigkeit"
    snap_basis_default: "Standardwert"
  hover:
    # `%{x:.3s}` / `%{z:,}` / `%{x:.0%}` are PLOTLY tokens -- leave them exactly
    # as they are. In `lorenz`, `%{q_label}` and `%{q_gini}` MUST stay ahead of
    # `%{x:.0%}` (see the ORDERING RULE in this file's header).
    contour: "%{q_x}: %{x:.3s}<br>%{q_y}: %{y:.3s}<br>%{z:,} Zeilen<extra></extra>"
    lorenz: "%{q_label} (Gini %{q_gini})<br>die unteren %{x:.0%} der Datensätze halten %{y:.0%}<extra></extra>"
    ohlc: "Eröffnung: %{open}<br>Hoch: %{high}<br>Tief: %{low}<br>Schluss: %{close}<extra></extra>"
    count_by_label: "%{hovertext}<br>Anzahl: %{y:,}<extra></extra>"
    histogram: "%{q_col}: %{x:,.3f}<br>Anzahl: %{y:,}<extra></extra>"
    polar_records: "%{theta}<br>Datensätze: %{r:,.0f}<extra></extra>"
    # Choroplethen-Hover pro Region. Das `%` in `pct_of_total` ist ein LITERALES
    # Prozentzeichen direkt hinter einem Platzhalter -- das ist unbedenklich.
    pct_of_total: "%{q_pct} % des Gesamtwerts"
    rank_of: "Rang %{q_rank} von %{q_total}"
    snap_includes: "davon %{q_n} von außen zugeordnet"
