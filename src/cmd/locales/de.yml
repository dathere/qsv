    dict_omissions_title: "Was weggelassen wurde"
    dict_omissions_body: "Nicht jede Spalte verdient ein Diagramm. Dieser Abschnitt hält jede übersprungene Spalte und jedes übersprungene Panel fest — samt dem genauen Grund."
    data_open_title: "Der Datenbetrachter"
    data_open_body: "Die Zeilen hinter den Diagrammen, als durchsuchbare Tabelle. Über den Link neben der Zeilenzahl jederzeit wieder zu öffnen."
    data_filter_title: "Erweiterte Filter"
    data_filter_body: "Der Filter-Button baut mehrteilige Suchen — UND/ODER-Gruppen über beliebige Spalten — und ergänzt so die Schnellsuchen."
    data_search_title: "Globale Suche"
    data_search_body: "Hier tippen, um alle Spalten auf einmal zu durchsuchen."
    data_colsearch_title: "Suche je Spalte"
    data_colsearch_body: "Jeder Spaltenkopf trägt sein eigenes Suchfeld, um jeweils eine Spalte einzugrenzen."
    data_export_title: "CSV-Export"
    data_export_body: "Die Tabelle — wie gefiltert — als CSV herunterladen."
    panels_intro_title: "Übersichtspanels"
    panels_intro_body: "Jedes Panel wurde passend zu den Daten seiner Spalte gewählt. Die nächsten Schritte erklären die Entscheidungen für diesen Datensatz."
    conclusion_title: "Das war die Tour"
    conclusion_body: "Starten Sie sie jederzeit neu über den Tour-Button oben auf der Seite. Viel Freude beim Erkunden!"
    explain:
      kpi: "Diese KPI-Kacheln eröffnen das Data Schematic mit seinen Kernzahlen — Datensatz- und Feldzahl, Vollständigkeit und den herausragenden Kennzahlen."
      box: "%{q_col} ist eine kontinuierliche numerische Spalte, daher wird ihre Verteilung als Boxplot aus ihren Quartilen gezeichnet — die Box ist die mittlere Hälfte der Werte."
      box_outliers: "%{q_col} ist kontinuierlich und trägt Werte jenseits der Tukey-Grenzen, daher überlagert ihr Boxplot diese Ausreißer zusätzlich als einzelne Punkte."
      violin: "%{q_col} ist eine kontinuierliche numerische Spalte; die Silhouette der Violine zeichnet die Dichte ihrer Werte nach, mit der Quartilsbox darin."
      freq: "%{q_col} hat nur %{q_n} verschiedene Werte, daher zeigt ein Balken je Wert dessen Anteil an den Zeilen."
      histogram: "%{q_col} ist eine kontinuierliche numerische Spalte; ihre Werte werden zu einem Histogramm gebündelt, das die Form der Verteilung zeigt."
      timeseries: "Dieser Datensatz trägt eine Datumsspalte, daher wird %{q_y} chronologisch darüber aufgetragen, um den Trend sichtbar zu machen."
      cyclic: "Die Zeitstempel wiederholen sich zyklisch, daher wird das Datenaufkommen auf diese wiederkehrende Phase gefaltet — so wird die Saisonalität sichtbar, die die Zeitachse verbirgt."
      corr: "Die %{q_n} numerischen Spalten werden in dieser Korrelations-Heatmap paarweise verglichen — dunklere Zellen heißen: zwei Spalten bewegen sich gemeinsam."
      assoc: "Diese Assoziations-Heatmap bewertet jedes Spaltenpaar per normalisierter Transinformation, die — anders als Korrelation — auch für kategoriale Spalten funktioniert."
      relationships: "Die stärksten Spaltenpaar-Assoziationen, gereiht. Die Punktposition ist die Stärke der Assoziation; die Punktgröße, wie viele Zeilen sie stützen."
      scatter: "%{q_x} und %{q_y} sind das am stärksten korrelierte Paar dieses Datensatzes und bekommen darum ein eigenes Streudiagramm."
      contour: "%{q_x} und %{q_y} sind das am stärksten korrelierte Paar; bei so vielen Zeilen würde ein Streudiagramm überzeichnen, daher wird ihre Dichte als Konturen gezeichnet."
      scatter3d: "Diese drei Spalten bilden das korrelationsstärkste Tripel und werden darum gemeinsam in einem drehbaren 3D-Streudiagramm gezeichnet."
      lorenz: "%{q_col} ist ungleich verteilt (Gini %{q_gini}); die Lorenzkurve zeigt, wie weit sich ihr kumulierter Anteil von der perfekten Gleichheit wegbiegt."
      funnel: "Das Datenwörterbuch deklariert diese Spalten als geordnete Prozessstufen, daher werden sie als Trichter von der ersten zur letzten Stufe gezeichnet."
      measure_by_dim: "Dieses Paar — eine Kennzahl nach einer Kategorie aufgeteilt — zeigt die stärkste solche Assoziation im Datensatz."
      grouped_violin: "Eine Verteilungssilhouette je Kategorie: dieselbe Aufteilung wie der Balken daneben, aber mit der ganzen Streuung statt eines einzelnen Aggregats."
      map: "Diese Daten tragen Koordinaten, daher werden ihre %{q_n} Punkte auf einer interaktiven Karte gezeichnet."
      choropleth: "Die Werte aggregieren sauber nach Region und werden daher als Choroplethenkarte auf die Regionsgrenzen schattiert."
      hierarchy: "Diese kategorialen Spalten verschachteln sich, daher wird ihre Zusammensetzung als interaktive Hierarchie gezeichnet — ein Klick auf ein Segment steigt hinab."
      sankey: "Ein gerichteter Fluss verbindet diese beiden Spalten, daher werden ihre Übergänge als Sankey-Diagramm gezeichnet — die Bandbreite ist das Flussvolumen."
      parcats: "Mehrere kategoriale Spalten werden hier zusammen gelesen: jedes Band folgt den Zeilen, die dieselbe Kategorienkombination teilen."
      animated_scatter: "Das korrelierte Paar erstreckt sich auch über die Zeit, daher ist das Streudiagramm animiert: Mit Play sehen Sie die Beziehung chronologisch entstehen."
      animated_geo: "Die kartierten Punkte sind datiert, daher ist die Karte animiert — mit Play sehen Sie die Ereignisse sich über die Zeit auf der Karte ansammeln."
      animated_bubble: "Jede Blase ist eine Kategorie, die ihren Weg durch zwei Kennzahlen über die Zeit zieht — mit Play läuft die Uhr."
      log_axis: "Ihre Werteachse ist logarithmisch, weil die Werte mehrere Größenordnungen umspannen."
      sampled: "Aus einer deterministischen Stichprobe der Zeilen gezeichnet, um reaktionsschnell zu bleiben."
