  chart:
    # `null_bucket` y `other_bucket` son etiquetas de DATOS: aparecen como valores de
    # categoria en los ejes. `null_bucket` tambien se usa como clave de agrupacion en
    # los paneles de jerarquia y parcats.
    log_axis_count: "recuento (log)"
    log_axis_value: "escala log"
    null_bucket: "(NULO)"
    other_bucket: "Otros (%{q_count})"
    records: "registros"
    # NO conectar con el analisis de `--agg`: ese valor es sintaxis de CLI.
    count: "recuento"
    rate_label: "%{q_what} %{q_per}"
    # Nombres de traza: el simbolo emparejado (`r`, `ρ`, `NMI`) no se traduce.
    trace_correlation: "correlación"
    trace_rank_correlation: "correlación por rangos"
    trace_association: "asociación"
  title:
    # TITULOS DE PANEL. Cada valor es un titulo COMPLETO (o un sufijo que solo se
    # une a uno de ellos), nunca un fragmento insertado en una frase.
    # `top_n` se comparte a proposito: es el sufijo de desborde de
    # `measure_by_dim` y de `distribution_by`, y de nada mas.
    data_overview: "%{q_dataset} — resumen de datos"
    map: "Mapa"
    distribution_by: "distribución de %{q_measure} por %{q_dim}"
    measure_by_dim: "%{q_measure} por %{q_dim} (%{q_agg}, explica el %{q_pct}% de la varianza)"
    top_n: " — %{q_n} principales"
    agg_sum: "suma"
    agg_mean: "media"
    sampled: "%{q_name} (muestreado)"
    dominated_by: "(dominado por %{q_value}, %{q_pct}%)"
    # `pair_r` y `pair_r_nonlinear` los comparten DOS titulos distintos (el par
    # animado y el par estatico); se traducen siempre junto con ambos.
    # `r`, `ρ`, `x` e `y` son simbolos/identificadores: no se traducen.
    pair_r: "%{q_x} vs %{q_y} (r=%{q_r})"
    pair_r_nonlinear: "%{q_x} vs %{q_y} (r=%{q_r}, ρ=%{q_rho} — no lineal)"
    pair_over_time: "%{q_pair} a lo largo del tiempo"
    pair_size: "%{q_name} · tamaño: %{q_col}"
    pair_log_x: "%{q_name} · log x"
    pair_log_y: "%{q_name} · log y"
    pair_log_xy: "%{q_name} · log x/y"
    bubble_over_time: "%{q_y} vs %{q_x} por %{q_entity} a lo largo del tiempo"
    locations_over_time: "ubicaciones a lo largo del tiempo"
    pair_log_scale: "%{q_name} · escala log"
    pair_log_scale_positive: "%{q_name} · escala log, solo valores positivos (%{q_share} de las filas omitidas)"
    # Paneles de tendencia. `q_unit` es salida del LLM y no se traduce aqui. Orden de
    # preferencia: `x-qsv.grain_unit` (estructurado, ya en el idioma destino), luego
    # texto extraido de la frase `x-qsv.grain` (heredado, solo ingles) y por ultimo
    # `viz.chart.records`.
    trend_raw: "%{q_y} a lo largo de %{q_date}"
    trend_agg: "%{q_y} (%{q_agg}) a lo largo de %{q_date}"
    trend_count: "%{q_unit} a lo largo de %{q_date}"
    trend_axis_agg: "%{q_y} (%{q_agg}/%{q_bucket})"
    trend_axis_count: "%{q_unit} por %{q_bucket}"
