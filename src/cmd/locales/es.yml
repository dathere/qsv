  hover:
    # `%{x:,.3~f}` / `%{z:,}` / `%{x:.0%}` son tokens de PLOTLY: no los traduzcas.
    # `%{q_label}` y `%{q_gini}` deben ir ANTES de `%{x:.0%}` (ver la ORDERING
    # RULE en en.yml); si se mueven detras, no se sustituyen.
    contour: "%{q_x}: %{x:,.3~f}<br>%{q_y}: %{y:,.3~f}<br>%{z:,} filas<extra></extra>"
