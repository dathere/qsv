    count_by_label: "%{hovertext}<br>recuento: %{y:,}<extra></extra>"
    histogram: "%{q_col}: %{x:,.3f}<br>recuento: %{y:,}<extra></extra>"
    polar_records: "%{theta}<br>registros: %{r:,.0f}<extra></extra>"
