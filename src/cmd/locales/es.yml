_version: 1

# Spanish (es) -- viz dashboard UI.
# TODO: native-speaker review before release. Accents ARE included (this file is
# UTF-8); the pending review is about wording and register, not encoding.
# Keys missing here fall back to en (see `fallback = "en"` in src/main.rs).
viz:
  chrome:
    theme_toggle: "\U0001F313 Tema"
    theme_toggle_aria: "Alternar modo claro/oscuro"
    toggle_fullscreen: "Alternar pantalla completa"
    toggle_legend: "Alternar leyenda"
    logo_alt: "qsv de datHere"
    credits_charts: "Gráficos:"
    credits_table: "Tabla:"
    credits_notices: "avisos"
  meta:
    description: "Descripción:"
    rows: "Filas:"
    columns: "Columnas:"
    completeness: "Integridad:"
    compiled: "Compilado:"
    pid: "PID:"
  viewer:
    link_explore: "(Explorar)"
    link_preview: "(Vista previa)"
    title_all: "Datos \u2014 %{q_rows} filas en total"
    title_preview: "Datos \u2014 primeras %{q_shown} de %{q_total} filas (vista previa)"
    export_csv: "CSV"
    export_csv_preview: "CSV (vista previa)"
  map:
    cluster_point_one: " punto"
    cluster_point_many: " puntos"
    cluster_click_to_zoom: " - haz clic para ampliar"
    row_not_in_preview: "fila no incluida en la vista previa"
    row_is_filtered_out: "fila excluida por el filtro"
  photo:
    alt: "Foto del punto señalado en el mapa"
    close: "Cerrar"
    enlarge: "Ampliar"
    enlarge_aria: "Ampliar foto"
    shrink: "Reducir"
    shrink_aria: "Reducir foto"
    previous: "Foto anterior"
    next: "Foto siguiente"
    unavailable: "imagen no disponible"
    unavailable_suffix: " - no disponible"
  dict:
    title: "Diccionario de datos"
    open_own_tab: "Abrir en su propia pestaña"
    close_esc: "Cerrar (Esc)"
    field_type: "Tipo"
    field_content_type: "Tipo de contenido"
    field_role: "Rol"
    field_concept: "Concepto"
    field_range: "Rango"
    field_cardinality: "Cardinalidad"
    field_null_count: "Valores nulos"
    field_values: "Valores"
    field_examples: "Ejemplos"
    role_unknown: "rol desconocido"
    grain: "Granularidad:"
    export_tooltip: "Descargar este diccionario de datos como JSON Schema"
    export_label: "Exportar JSONSchema"
    export_short: "esquema"
    view_chart: "Ver gráfico "
    back_to_dashboard: "Volver al panel"
    sidecar_download_tooltip: "Descargar %{q_file}, un archivo complementario con el que se construyó este panel"
  drawer:
    row_selected_one: " fila seleccionada"
    row_selected_many: " filas seleccionadas"
    close_viewer: "Cerrar el visor de datos"
    clear_filters: "Borrar filtros"
    clear_filters_prefix: "Borrar filtros ("
    viewer_failed: "qsv viz: fallo el visor de datos:"
    advanced_filter: "Filtro avanzado"
    advanced_filter_counted: "Filtro avanzado (%d)"
  chart:
    # `null_bucket` y `other_bucket` son etiquetas de DATOS: aparecen como valores de
    # categoria en los ejes. `null_bucket` tambien se usa como clave de agrupacion en
    # los paneles de jerarquia y parcats.
    log_axis_count: "recuento (log)"
    log_axis_value: "escala log"
    null_bucket: "(NULO)"
    other_bucket: "Otros (%{q_count})"
    records: "registros"
  title:
    # TITULOS DE PANEL. Cada valor es un titulo COMPLETO (o un sufijo que solo se
    # une a uno de ellos), nunca un fragmento insertado en una frase.
    # `top_n` se comparte a proposito: es el sufijo de desborde de
    # `measure_by_dim` y de `distribution_by`, y de nada mas.
    data_overview: "%{q_dataset} — resumen de datos"
    map: "Mapa"
    distribution_by: "distribución de %{q_measure} por %{q_dim}"
    measure_by_dim: "%{q_measure} por %{q_dim} (%{q_agg}, explica el %{q_pct}% de la varianza)"
    top_n: " — %{q_n} principales"
    agg_sum: "suma"
    agg_mean: "media"
    sampled: "%{q_name} (muestreado)"
    dominated_by: "(dominado por %{q_value}, %{q_pct}%)"
    # `pair_r` y `pair_r_nonlinear` los comparten DOS titulos distintos (el par
    # animado y el par estatico); se traducen siempre junto con ambos.
    # `r`, `ρ`, `x` e `y` son simbolos/identificadores: no se traducen.
    pair_r: "%{q_x} vs %{q_y} (r=%{q_r})"
    pair_r_nonlinear: "%{q_x} vs %{q_y} (r=%{q_r}, ρ=%{q_rho} — no lineal)"
    pair_over_time: "%{q_pair} a lo largo del tiempo"
    pair_size: "%{q_name} · tamaño: %{q_col}"
    pair_log_x: "%{q_name} · log x"
    pair_log_y: "%{q_name} · log y"
    pair_log_xy: "%{q_name} · log x/y"
    bubble_over_time: "%{q_y} vs %{q_x} por %{q_entity} a lo largo del tiempo"
    locations_over_time: "ubicaciones a lo largo del tiempo"
    pair_log_scale: "%{q_name} · escala log"
    pair_log_scale_positive: "%{q_name} · escala log, solo valores positivos (%{q_share} de las filas omitidas)"
    # Paneles de tendencia. `q_unit` puede ser `viz.chart.records` o texto derivado
    # del grano del diccionario (salida del LLM, ya traducida): no se traduce aqui.
    trend_raw: "%{q_y} a lo largo de %{q_date}"
    trend_agg: "%{q_y} (%{q_agg}) a lo largo de %{q_date}"
    trend_count: "%{q_unit} a lo largo de %{q_date}"
    trend_axis_agg: "%{q_y} (%{q_agg}/%{q_bucket})"
    trend_axis_count: "%{q_unit} por %{q_bucket}"
    bucket_day: "día"
    bucket_week: "semana"
    bucket_month: "mes"
    corr_spearman: "Correlación (Spearman ρ — por rangos, robusta a atípicos)"
    corr_pearson: "Correlación (Pearson r)"
    scatter3d: "%{q_x} / %{q_y} / %{q_z} (3D)"
    cyclic_records_by: "Registros por %{q_axis} (%{q_date})"
    cyclic_hour_of_day: "hora del día"
    cyclic_day_of_week: "día de la semana"
    cyclic_month: "mes"
  notes:
    # Lista separada por comas, no una frase: cada elemento se traduce por separado.
    box_null: "%{q_pct}% nulos"
    box_zeros: "%{q_pct}% ceros"
    box_right_skewed: "asimetría derecha"
    box_left_skewed: "asimetría izquierda"
    box_outliers: "%{q_pct}% atípicos"
    box_heavy_tails: "colas pesadas"
    box_mean_impact: "media %{q_pct}% por atípicos"
    box_gini: "Gini %{q_gini}"
    lorenz_unit: "la concentración es esperable salvo que las filas sean unidades comparables"
    lorenz_zeros: "tramo plano = %{q_pct}% ceros, no valores pequeños · %{q_unit}"
    funnel_complete: "n = %{q_n} casos completos (%{q_pct}% de las filas)"
    funnel_violation: "%{q_here} supera a %{q_prev} en %{q_pct}% de las filas"
    funnel_bridge: "las etapas no se anidan — puente, no embudo"
    funnel_inverted: "el total de %{q_here} supera a %{q_prev} — excesos, no fugas"
  hover:
    # `%{x:.3s}` / `%{z:,}` / `%{x:.0%}` son tokens de PLOTLY: no los traduzcas.
    # `%{q_label}` y `%{q_gini}` deben ir ANTES de `%{x:.0%}` (ver la ORDERING
    # RULE en en.yml); si se mueven detras, no se sustituyen.
    contour: "%{q_x}: %{x:.3s}<br>%{q_y}: %{y:.3s}<br>%{z:,} filas<extra></extra>"
    lorenz: "%{q_label} (Gini %{q_gini})<br>el %{x:.0%} inferior de los registros posee el %{y:.0%}<extra></extra>"
    ohlc: "Apertura: %{open}<br>Máximo: %{high}<br>Mínimo: %{low}<br>Cierre: %{close}<extra></extra>"
    count_by_label: "%{hovertext}<br>recuento: %{y:,}<extra></extra>"
    histogram: "%{q_col}: %{x:,.3f}<br>recuento: %{y:,}<extra></extra>"
    polar_records: "%{theta}<br>registros: %{r:,.0f}<extra></extra>"
