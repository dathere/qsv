    data_colsearch_title: "Recherche par colonne"
    data_colsearch_body: "Chaque en-tête de colonne porte son propre champ de recherche, pour restreindre une colonne à la fois."
    data_export_title: "Export CSV"
    data_export_body: "Téléchargez le tableau — tel que filtré — au format CSV."
    panels_intro_title: "Panneaux de synthèse"
    panels_intro_body: "Chaque panneau a été choisi pour s'adapter aux données de sa colonne. Les étapes suivantes expliquent les choix faits pour ce jeu de données."
    conclusion_title: "Fin de la visite"
    conclusion_body: "Relancez-la à tout moment avec le bouton Visite en haut de la page. Bonne exploration !"
    explain:
      kpi: "Ces vignettes KPI ouvrent le Data Schematic avec ses chiffres clés : nombre d'enregistrements et de champs, complétude et mesures marquantes."
      box: "%{q_col} est une colonne numérique continue : sa distribution est dessinée en boîte à moustaches à partir de ses quartiles — la boîte est la moitié centrale des valeurs."
      box_outliers: "%{q_col} est continue et porte des valeurs au-delà des bornes de Tukey : sa boîte à moustaches superpose donc aussi ces valeurs atypiques en points individuels."
      violin: "%{q_col} est une colonne numérique continue ; la silhouette du violon trace la densité de ses valeurs, avec la boîte des quartiles à l'intérieur."
      freq: "%{q_col} n'a que %{q_n} valeurs distinctes : une barre par valeur montre la part de lignes de chacune."
      histogram: "%{q_col} est une colonne numérique continue ; ses valeurs sont regroupées en histogramme pour montrer la forme de la distribution."
      timeseries: "Ce jeu de données porte une colonne de date : %{q_y} y est tracée chronologiquement pour révéler la tendance."
      cyclic: "Les horodatages se répètent selon un cycle : le volume d'enregistrements est replié sur cette phase répétée pour révéler la saisonnalité que la chronologie masque."
      corr: "Les %{q_n} colonnes numériques sont comparées deux à deux dans cette carte de chaleur de corrélation — plus une case est sombre, plus deux colonnes évoluent ensemble."
      assoc: "Cette carte de chaleur d'association note chaque paire de colonnes par information mutuelle normalisée, qui — contrairement à la corrélation — fonctionne aussi pour les colonnes catégorielles."
      relationships: "Les associations de paires de colonnes les plus fortes, classées. La position du point donne la force de l'association ; sa taille, le nombre de lignes qui l'appuient."
      scatter: "%{q_x} et %{q_y} forment la paire la plus corrélée de ce jeu de données : elles reçoivent leur propre nuage de points."
      contour: "%{q_x} et %{q_y} forment la paire la plus corrélée ; avec autant de lignes un nuage saturerait, leur densité est donc tracée en contours."
      scatter3d: "Ces trois colonnes forment le triplet le plus corrélé : elles sont dessinées ensemble dans un nuage 3D orientable."
      lorenz: "%{q_col} est répartie de façon inégale (Gini %{q_gini}) ; la courbe de Lorenz montre combien sa part cumulée s'écarte de l'égalité parfaite."
      funnel: "Le dictionnaire de données déclare ces colonnes comme étapes ordonnées d'un processus : elles sont dessinées en entonnoir, de la première étape à la dernière."
      measure_by_dim: "Cette paire — une mesure ventilée par catégorie — montre l'association de ce type la plus forte du jeu de données."
      grouped_violin: "Une silhouette de distribution par catégorie : la même ventilation que la barre voisine, mais montrant toute la dispersion plutôt qu'un seul agrégat."
      map: "Ces données portent des coordonnées : leurs %{q_n} points sont dessinés sur une carte interactive."
      choropleth: "Les valeurs s'agrègent proprement par région : elles sont ombrées sur les limites régionales en carte choroplèthe."
      hierarchy: "Ces colonnes catégorielles s'emboîtent : leur composition est dessinée en hiérarchie interactive — cliquez sur un segment pour descendre."
      sankey: "Un flux orienté relie ces deux colonnes : leurs croisements sont dessinés en diagramme de Sankey — la largeur du ruban est le volume du flux."
      parcats: "Plusieurs colonnes catégorielles se lisent ici ensemble : chaque ruban trace les lignes qui partagent la même combinaison de catégories."
      animated_scatter: "La paire corrélée s'étend aussi dans le temps : le nuage est animé — appuyez sur Lecture pour voir la relation se construire chronologiquement."
      animated_geo: "Les points cartographiés sont datés : la carte est animée — appuyez sur Lecture pour voir les événements s'accumuler sur la carte au fil du temps."
      animated_bubble: "Chaque bulle est une catégorie traçant son chemin à travers deux mesures au fil du temps — appuyez sur Lecture pour lancer l'horloge."
      log_axis: "Son axe des valeurs est logarithmique, car les valeurs couvrent plusieurs ordres de grandeur."
      sampled: "Dessiné à partir d'un échantillon déterministe des lignes, pour rester réactif."
    meta_heading: "Narration de la visite"
    meta_audience: "Public :"
    meta_language: "Langue :"
    meta_model: "Généré par :"
    meta_step: "Étape"
    meta_panel: "Panneau"
