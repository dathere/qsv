_version: 1

# French (fr) -- viz dashboard UI.
# TODO: native-speaker review before release. Accents ARE included (this file is
# UTF-8); the pending review is about wording and register, not encoding.
# Keys missing here fall back to en (see `fallback = "en"` in src/main.rs).
#
# ORDERING RULE: in `hover`, every `%{q_*}` must stay AHEAD of any plotly token
# containing a literal `%` inside its braces (`%{x:.0%}`), or it is left
# unsubstituted. See the header of en.yml.
viz:
  chrome:
    theme_toggle: "\U0001F313 Thème"
    theme_toggle_aria: "Basculer entre le mode clair et sombre"
    toggle_fullscreen: "Basculer en plein écran"
    toggle_legend: "Afficher ou masquer la légende"
    logo_alt: "qsv par datHere"
    credits_charts: "Graphiques :"
    credits_table: "Tableau :"
    credits_notices: "mentions"
  meta:
    description: "Description :"
    rows: "Lignes :"
    columns: "Colonnes :"
    completeness: "Complétude :"
    compiled: "Compilé :"
    pid: "PID :"
  viewer:
    link_explore: "(Explorer)"
    link_preview: "(Aperçu)"
    title_all: "Données — les %{q_rows} lignes"
    title_preview: "Données — %{q_shown} premières lignes sur %{q_total} (aperçu)"
    export_csv: "CSV"
    export_csv_preview: "CSV (aperçu)"
  map:
    cluster_point_one: " point"
    cluster_point_many: " points"
    cluster_click_to_zoom: " - cliquer pour zoomer"
    row_not_in_preview: "ligne absente de l'aperçu"
    row_is_filtered_out: "ligne exclue par un filtre"
    row_not_plotted: "ligne absente des points tracés"
    row_has_no_coordinates: "la ligne n'a pas de coordonnées cartographiques"
    region_filter_applied: "lignes filtrées sur %{q_region}"
    region_filter_cleared: "filtre de région effacé"
    extent_points: "points d'étendue"
    spatial_extent: "étendue spatiale"
    full_extent: "étendue totale (valeurs aberrantes incluses)"
    geographic_outliers: "valeurs aberrantes géographiques"
    geo_extent_caption: "Étendue spatiale : %{q_summary}"
    geo_outlier_one: "valeur aberrante"
    geo_outlier_many: "valeurs aberrantes"
    geo_outliers: "%{q_core} — %{q_n} %{q_noun}"
    geo_outliers_where: "%{q_core} — %{q_n} %{q_noun} (%{q_where})"
    geo_n_countries: "%{q_n} pays"
    geo_n_regions: "%{q_n} régions%{q_suffix}"
    geo_n_areas: "%{q_n} zones"
  photo:
    alt: "Photo du point survolé sur la carte"
    close: "Fermer"
    enlarge: "Agrandir"
    enlarge_aria: "Agrandir la photo"
    shrink: "Réduire"
    shrink_aria: "Réduire la photo"
    previous: "Photo précédente"
    next: "Photo suivante"
    unavailable: "image indisponible"
    unavailable_suffix: " - indisponible"
  dict:
    notable_characteristics: "Caractéristiques notables"
    title: "Dictionnaire de données"
    open_own_tab: "Ouvrir dans un onglet dédié"
    close_esc: "Fermer (Échap)"
    field_type: "Type"
    field_content_type: "Type de contenu"
    field_role: "Rôle"
    field_concept: "Concept"
    field_range: "Plage"
    field_cardinality: "Cardinalité"
    field_null_count: "Nombre de valeurs nulles"
    field_values: "Valeurs"
    field_examples: "Exemples"
    role_unknown: "rôle inconnu"
    grain: "Granularité :"
    export_tooltip: "Télécharger ce dictionnaire de données au format JSON Schema"
    export_label: "Exporter le JSONSchema"
    export_short: "schéma"
    view_chart: "Voir le graphique "
    back_to_dashboard: "Retour au tableau de bord"
    sidecar_download_tooltip: "Télécharger %{q_file}, un fichier annexe ayant servi à construire ce tableau de bord"
  drawer:
    row_selected_one: " ligne sélectionnée"
    row_selected_many: " lignes sélectionnées"
    close_viewer: "Fermer la visionneuse de données"
    clear_filters: "Effacer les filtres"
    clear_filters_prefix: "Effacer les filtres ("
    viewer_failed: "qsv viz : échec de la visionneuse de données :"
    advanced_filter: "Filtre avancé"
    advanced_filter_counted: "Filtre avancé (%d)"
  cycle:
    # Keep these SHORT: they ring a polar chart and plotly neither wraps nor
    # elides them.
    day_mon: "lun"
    day_tue: "mar"
    day_wed: "mer"
    day_thu: "jeu"
    day_fri: "ven"
    day_sat: "sam"
    day_sun: "dim"
    month_jan: "janv"
    month_feb: "févr"
    month_mar: "mars"
    month_apr: "avr"
    month_may: "mai"
    month_jun: "juin"
    month_jul: "juil"
    month_aug: "août"
    month_sep: "sept"
    month_oct: "oct"
    month_nov: "nov"
    month_dec: "déc"
  menu:
    # KEEP THE LEADING GLYPH (`▶` U+25B6, `⏸` U+23F8, `⇅` U+21C5) and the space
    # after it -- they are part of the control, not words.
    play: "▶ Lecture"
    pause: "⏸ Pause"
    category_order: "⇅ ordre des catégories"
    node_order: "⇅ ordre des nœuds"
    extent_core: "Étendue principale"
    extent_full: "Étendue totale"
    cluster_toggle: "Groupes/Points"
    basemap_labels: "Étiquettes du fond de carte"
  chart:
    log_axis_count: "nombre (log)"
    log_axis_value: "échelle log"
    null_bucket: "(NUL)"
    other_bucket: "Autre (%{q_count})"
    records: "enregistrements"
    count: "nombre"
    trace_correlation: "corrélation"
    trace_rank_correlation: "corrélation des rangs"
    trace_association: "association"
  title:
    data_overview: "%{q_dataset} — aperçu des données"
    map: "Carte"
    distribution_by: "distribution de %{q_measure} par %{q_dim}"
    measure_by_dim: "%{q_measure} par %{q_dim} (%{q_agg}, explique %{q_pct} % de la variance)"
    top_n: " — %{q_n} premiers"
    agg_sum: "somme"
    agg_mean: "moyenne"
    sampled: "%{q_name} (échantillon)"
    dominated_by: "(dominé par %{q_value}, %{q_pct} %)"
    # `r` and `ρ` are statistical symbols -- leave them literal.
    pair_r: "%{q_x} vs %{q_y} (r=%{q_r})"
    pair_r_nonlinear: "%{q_x} vs %{q_y} (r=%{q_r}, ρ=%{q_rho} — non linéaire)"
    pair_over_time: "%{q_pair} au fil du temps"
    pair_size: "%{q_name} · taille : %{q_col}"
    # `x` / `y` are plotly axis identifiers -- literal in every locale.
    pair_log_x: "%{q_name} · log x"
    pair_log_y: "%{q_name} · log y"
    pair_log_xy: "%{q_name} · log x/y"
    bubble_over_time: "%{q_y} vs %{q_x} par %{q_entity} au fil du temps"
    locations_over_time: "localisations au fil du temps"
    pair_log_scale: "%{q_name} · échelle log"
    pair_log_scale_positive: "%{q_name} · échelle log, valeurs positives uniquement (%{q_share} des lignes omises)"
    trend_raw: "%{q_y} au fil de %{q_date}"
    trend_agg: "%{q_y} (%{q_agg}) au fil de %{q_date}"
    trend_count: "%{q_unit} au fil de %{q_date}"
    trend_axis_agg: "%{q_y} (%{q_agg}/%{q_bucket})"
    trend_axis_count: "%{q_unit} par %{q_bucket}"
    bucket_day: "jour"
    bucket_week: "semaine"
    bucket_month: "mois"
    bucket_quarter: "trimestre"
    bucket_year: "an"
    corr_spearman: "Corrélation (ρ de Spearman — rangs, robuste aux valeurs aberrantes)"
    corr_pearson: "Corrélation (r de Pearson)"
    scatter3d: "%{q_x} / %{q_y} / %{q_z} (3D)"
    # NMI = normalized mutual information; the acronym stays literal.
    assoc_heatmap: "Association (NMI)"
    top_relationships: "Principales relations (NMI)"
    us_states: "États des États-Unis"
    countries: "Pays"
    count_by_region: "nombre par %{q_region}"
    # `≤` / `>` are math symbols, `km` is SI, and `--no-snap` (which arrives as
    # `%{q_why}`) is a FLAG NAME -- all literal.
    regions: "Régions"
    regions_with: "Régions (%{q_parts})"
    snap_snapped: "%{q_n} rattachés ≤%{q_km} km"
    snap_dropped: "%{q_n} sur %{q_total} écartés, %{q_why}"
    snap_why_over: ">%{q_km} km"
    category_flow: "Flux de catégories : %{q_dims}"
    kpi_mean: "Moyenne de %{q_label}"
    kpi_total: "Total de %{q_label}"
    cyclic_records_by: "Enregistrements par %{q_axis} (%{q_date})"
    cyclic_hour_of_day: "heure de la journée"
    cyclic_day_of_week: "jour de la semaine"
    cyclic_month: "mois"
  notes:
    box_null: "%{q_pct} % de valeurs nulles"
    box_zeros: "%{q_pct} % de zéros"
    box_right_skewed: "asymétrie à droite"
    box_left_skewed: "asymétrie à gauche"
    box_outliers: "%{q_pct} % de valeurs aberrantes"
    box_heavy_tails: "queues lourdes"
    box_mean_impact: "moyenne décalée de %{q_pct} % par les valeurs aberrantes"
    box_gini: "Gini %{q_gini}"
    lorenz_unit: "la concentration est attendue sauf si les lignes sont des unités comparables"
    lorenz_zeros: "palier plat = %{q_pct} % de zéros, et non de petites valeurs · %{q_unit}"
    funnel_complete: "n = %{q_n} cas complets (%{q_pct} % des lignes)"
    funnel_violation: "%{q_here} dépasse %{q_prev} dans %{q_pct} % des lignes"
    funnel_bridge: "les étapes ne s'emboîtent pas — pontées, et non en entonnoir"
    funnel_inverted: "le total de %{q_here} dépasse %{q_prev} — dépassements, et non fuites"
    # `--no-snap` and `--snap-max-dist` are FLAG NAMES: keep them verbatim.
    snap_coverage: "%{q_n} points sur %{q_total} ont été rattachés à la région la plus proche (≤%{q_km} km, %{q_basis})."
    drop_coverage: "%{q_n} points sur %{q_total} se trouvaient à plus de %{q_km} km de toute région et ont été écartés."
    drop_coverage_no_snap: "--no-snap : %{q_n} points sur %{q_total} sont tombés en dehors de toutes les régions GeoJSON et ont été écartés."
    snap_basis_explicit: "--snap-max-dist"
    snap_basis_region_precision: "dérivé de la taille des régions et de la précision des coordonnées"
    snap_basis_region: "dérivé de la taille des régions"
    snap_basis_precision: "dérivé de la précision des coordonnées"
    snap_basis_default: "valeur par défaut"
  hover:
    # `%{x:.3s}` / `%{z:,}` / `%{x:.0%}` are PLOTLY tokens -- leave them exactly
    # as they are. In `lorenz`, `%{q_label}` and `%{q_gini}` MUST stay ahead of
    # `%{x:.0%}` (see the ORDERING RULE in this file's header).
    contour: "%{q_x} : %{x:.3s}<br>%{q_y} : %{y:.3s}<br>%{z:,} lignes<extra></extra>"
    lorenz: "%{q_label} (Gini %{q_gini})<br>les %{x:.0%} inférieurs des enregistrements détiennent %{y:.0%}<extra></extra>"
    ohlc: "Ouverture : %{open}<br>Haut : %{high}<br>Bas : %{low}<br>Clôture : %{close}<extra></extra>"
    count_by_label: "%{hovertext}<br>nombre : %{y:,}<extra></extra>"
    histogram: "%{q_col} : %{x:,.3f}<br>nombre : %{y:,}<extra></extra>"
    polar_records: "%{theta}<br>enregistrements : %{r:,.0f}<extra></extra>"
    # Lignes de survol par région du choroplèthe. Le `%` de `pct_of_total` est un signe
    # pourcent LITTERAL placé juste après un emplacement, ce qui est sans danger.
    pct_of_total: "%{q_pct} % du total"
    rank_of: "rang %{q_rank} sur %{q_total}"
    snap_includes: "dont %{q_n} rattachés depuis l'extérieur"
