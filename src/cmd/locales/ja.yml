_version: 1

# Japanese (ja) -- viz dashboard UI.
# TODO: native-speaker review before release. The pending review is about wording
# and register, not encoding (this file is UTF-8).
# Keys missing here fall back to en (see `fallback = "en"` in src/main.rs).
#
# ORDERING RULE: in `hover`, every `%{q_*}` must stay AHEAD of any plotly token
# containing a literal `%` inside its braces (`%{x:.0%}`), or it is left
# unsubstituted. See the header of en.yml.
viz:
  chrome:
    theme_toggle: "\U0001F313 テーマ"
    theme_toggle_aria: "ライト/ダークモードを切り替え"
    toggle_fullscreen: "全画面表示を切り替え"
    toggle_legend: "凡例を切り替え"
    logo_alt: "datHere の qsv"
    credits_charts: "グラフ:"
    credits_table: "テーブル:"
    credits_notices: "ライセンス表示"
  meta:
    description: "説明:"
    rows: "行数:"
    columns: "列数:"
    completeness: "完全性:"
    compiled: "生成日時:"
    pid: "PID:"
  viewer:
    link_explore: "(詳細表示)"
    link_preview: "(プレビュー)"
    title_all: "データ — 全 %{q_rows} 行"
    title_preview: "データ — %{q_total} 行中の先頭 %{q_shown} 行(プレビュー)"
    export_csv: "CSV"
    export_csv_preview: "CSV(プレビュー)"
