    # Keep these SHORT: they ring a polar chart and plotly neither wraps nor
    # elides them. Japanese uses the single-character weekday forms.
    day_mon: "月"
    day_tue: "火"
    day_wed: "水"
    day_thu: "木"
    day_fri: "金"
    day_sat: "土"
    day_sun: "日"
    month_jan: "1月"
    month_feb: "2月"
    month_mar: "3月"
    month_apr: "4月"
    month_may: "5月"
    month_jun: "6月"
    month_jul: "7月"
    month_aug: "8月"
    month_sep: "9月"
    month_oct: "10月"
    month_nov: "11月"
    month_dec: "12月"
  menu:
    # KEEP THE LEADING GLYPH (`▶` U+25B6, `⏸` U+23F8, `⇅` U+21C5) and the space
    # after it -- they are part of the control, not words.
    play: "▶ 再生"
    pause: "⏸ 一時停止"
    category_order: "⇅ カテゴリ順"
    node_order: "⇅ ノード順"
    extent_core: "主要範囲"
    extent_full: "全体範囲"
    cluster_toggle: "クラスタ/ポイント"
    basemap_labels: "ベースマップのラベル"
  chart:
    log_axis_count: "件数(対数)"
    log_axis_value: "対数スケール"
    null_bucket: "(NULL)"
    other_bucket: "その他(%{q_count})"
    records: "レコード"
    count: "件数"
    trace_correlation: "相関"
    trace_rank_correlation: "順位相関"
    trace_association: "関連度"
  title:
    data_overview: "%{q_dataset} — データ概要"
    map: "地図"
    distribution_by: "%{q_dim} 別の %{q_measure} の分布"
    measure_by_dim: "%{q_dim} 別の %{q_measure}(%{q_agg}、分散の %{q_pct}% を説明)"
    top_n: " — 上位 %{q_n}"
    agg_sum: "合計"
    agg_mean: "平均"
    sampled: "%{q_name}(サンプル)"
    dominated_by: "(%{q_value} が優勢、%{q_pct}%)"
    # `r` and `ρ` are statistical symbols -- leave them literal.
    pair_r: "%{q_x} と %{q_y}(r=%{q_r})"
    pair_r_nonlinear: "%{q_x} と %{q_y}(r=%{q_r}, ρ=%{q_rho} — 非線形)"
    pair_over_time: "%{q_pair} の時系列推移"
    pair_size: "%{q_name} · サイズ: %{q_col}"
    # `x` / `y` are plotly axis identifiers -- literal in every locale.
    pair_log_x: "%{q_name} · log x"
    pair_log_y: "%{q_name} · log y"
    pair_log_xy: "%{q_name} · log x/y"
    bubble_over_time: "%{q_entity} 別の %{q_y} と %{q_x} の時系列推移"
    locations_over_time: "地点の時系列推移"
    pair_log_scale: "%{q_name} · 対数スケール"
    pair_log_scale_positive: "%{q_name} · 対数スケール、正の値のみ(全行の %{q_share} を除外)"
    trend_raw: "%{q_date} ごとの %{q_y}"
    trend_agg: "%{q_date} ごとの %{q_y}(%{q_agg})"
    trend_count: "%{q_date} ごとの %{q_unit}"
    trend_axis_agg: "%{q_y}(%{q_agg}/%{q_bucket})"
    trend_axis_count: "%{q_bucket} あたりの %{q_unit}"
    bucket_day: "日"
    bucket_week: "週"
    bucket_month: "月"
    bucket_quarter: "四半期"
    bucket_year: "年"
    corr_spearman: "相関(スピアマン ρ — 順位ベース、外れ値に頑健)"
    corr_pearson: "相関(ピアソン r)"
    scatter3d: "%{q_x} / %{q_y} / %{q_z}(3D)"
    # NMI = normalized mutual information; the acronym stays literal.
    assoc_heatmap: "関連度(NMI)"
    top_relationships: "主要な関連(NMI)"
    us_states: "米国の州"
    countries: "国"
    count_by_region: "%{q_region} 別の件数"
    # `≤` / `>` are math symbols, `km` is SI, and `--no-snap` (which arrives as
    # `%{q_why}`) is a FLAG NAME -- all literal.
    regions: "地域"
    regions_with: "地域(%{q_parts})"
    snap_snapped: "%{q_n} 件を ≤%{q_km} km でスナップ"
    snap_dropped: "%{q_total} 件中 %{q_n} 件を除外、%{q_why}"
    snap_why_over: ">%{q_km} km"
    category_flow: "カテゴリの流れ: %{q_dims}"
    kpi_mean: "%{q_label} の平均"
    kpi_total: "%{q_label} の合計"
    cyclic_records_by: "%{q_axis} 別のレコード数(%{q_date})"
    cyclic_hour_of_day: "時刻"
    cyclic_day_of_week: "曜日"
    cyclic_month: "月"
  notes:
    box_null: "%{q_pct}% が欠損"
    box_zeros: "%{q_pct}% がゼロ"
    box_right_skewed: "右に歪んだ分布"
    box_left_skewed: "左に歪んだ分布"
    box_outliers: "%{q_pct}% が外れ値"
    box_heavy_tails: "裾が重い"
    box_mean_impact: "外れ値により平均が %{q_pct}% 変動"
    box_gini: "Gini %{q_gini}"
    lorenz_unit: "行が比較可能な単位でない限り、集中は想定どおりです"
    lorenz_zeros: "平坦な区間 = %{q_pct}% がゼロであり、小さな値ではありません · %{q_unit}"
    funnel_complete: "n = %{q_n} 件の完全なケース(全行の %{q_pct}%)"
    funnel_violation: "%{q_pct}% の行で %{q_here} が %{q_prev} を超過"
    funnel_bridge: "各段階が入れ子になっていません — ファネルではなくブリッジです"
    funnel_inverted: "%{q_here} の合計が %{q_prev} を超過 — 離脱ではなく超過です"
    # `--no-snap` and `--snap-max-dist` are FLAG NAMES: keep them verbatim.
    snap_coverage: "%{q_total} 件中 %{q_n} 件のポイントを最も近い地域にスナップしました(≤%{q_km} km、%{q_basis})。"
    drop_coverage: "%{q_total} 件中 %{q_n} 件のポイントはどの地域からも %{q_km} km を超えて離れていたため除外しました。"
    drop_coverage_no_snap: "--no-snap: %{q_total} 件中 %{q_n} 件のポイントがどの GeoJSON 地域にも含まれず除外されました。"
    snap_basis_explicit: "--snap-max-dist"
    snap_basis_region_precision: "地域サイズと座標精度から自動導出"
    snap_basis_region: "地域サイズから自動導出"
    snap_basis_precision: "座標精度から自動導出"
    snap_basis_default: "既定値"
  hover:
    # `%{x:.3s}` / `%{z:,}` / `%{x:.0%}` are PLOTLY tokens -- leave them exactly
    # as they are. In `lorenz`, `%{q_label}` and `%{q_gini}` MUST stay ahead of
    # `%{x:.0%}` (see the ORDERING RULE in this file's header).
    contour: "%{q_x}: %{x:.3s}<br>%{q_y}: %{y:.3s}<br>%{z:,} 行<extra></extra>"
    lorenz: "%{q_label}(Gini %{q_gini})<br>下位 %{x:.0%} のレコードが %{y:.0%} を保有<extra></extra>"
    ohlc: "始値: %{open}<br>高値: %{high}<br>安値: %{low}<br>終値: %{close}<extra></extra>"
    count_by_label: "%{hovertext}<br>件数: %{y:,}<extra></extra>"
    histogram: "%{q_col}: %{x:,.3f}<br>件数: %{y:,}<extra></extra>"
    polar_records: "%{theta}<br>レコード数: %{r:,.0f}<extra></extra>"
    pct_of_total: "全体の %{q_pct}%"
    rank_of: "%{q_total} 件中 %{q_rank} 位"
    snap_includes: "うち %{q_n} 件は外部からスナップ"
