    data_colsearch_body: "Cada cabeçalho de coluna traz sua própria caixa de busca, para afunilar uma coluna por vez."
    data_export_title: "Exportar CSV"
    data_export_body: "Baixe a tabela — do jeito que está filtrada — de volta como CSV."
    panels_intro_title: "Painéis de resumo"
    panels_intro_body: "Cada painel foi escolhido para se ajustar aos dados de sua coluna. Os próximos passos explicam as escolhas feitas para este conjunto de dados."
    conclusion_title: "Fim do tour"
    conclusion_body: "Reinicie-o quando quiser pelo botão Tour no topo da página. Boa exploração!"
    explain:
      kpi: "Estes cartões de KPI abrem o Data Schematic com seus números principais — contagens de registros e campos, completude e as medidas de destaque."
      box: "%{q_col} é uma coluna numérica contínua, então sua distribuição é desenhada como box plot a partir dos quartis — a caixa é a metade central dos valores."
      box_outliers: "%{q_col} é contínua e carrega valores além das cercas de Tukey, então seu box plot também sobrepõe esses outliers como pontos individuais."
      violin: "%{q_col} é uma coluna numérica contínua; a silhueta do violino traça a densidade dos seus valores, com a caixa de quartis por dentro."
      freq: "%{q_col} tem apenas %{q_n} valores distintos, então uma barra por valor mostra a fatia de linhas de cada um."
      histogram: "%{q_col} é uma coluna numérica contínua; seus valores são agrupados em um histograma para mostrar a forma da distribuição."
      timeseries: "Este conjunto de dados carrega uma coluna de data, então %{q_y} é traçada sobre ela em ordem cronológica para expor a tendência."
      cyclic: "Os timestamps se repetem em um ciclo, então o volume de registros é dobrado sobre essa fase repetida para expor a sazonalidade que a linha do tempo esconde."
      corr: "As %{q_n} colunas numéricas são comparadas aos pares neste mapa de calor de correlação — células mais escuras significam duas colunas que se movem juntas."
      assoc: "Este mapa de calor de associação pontua cada par de colunas por informação mútua normalizada, que — ao contrário da correlação — também funciona para colunas categóricas."
      relationships: "As associações de pares de colunas mais fortes, ranqueadas. A posição do ponto é a força da associação; o tamanho, quantas linhas a sustentam."
      scatter: "%{q_x} e %{q_y} são o par mais correlacionado deste conjunto de dados, então ganham um gráfico de dispersão só deles."
      contour: "%{q_x} e %{q_y} são o par mais correlacionado; com tantas linhas uma dispersão ficaria saturada, então a densidade deles é desenhada em contornos."
      scatter3d: "Estas três colunas formam a tripla de correlação mais forte, então são desenhadas juntas em uma dispersão 3D giratória."
      lorenz: "%{q_col} está distribuída de forma desigual (Gini %{q_gini}); a curva de Lorenz mostra o quanto sua fatia acumulada se curva para longe da igualdade perfeita."
      funnel: "O dicionário de dados declara estas colunas como etapas ordenadas de um processo, então elas são desenhadas como funil da primeira à última etapa."
      measure_by_dim: "Este par — uma medida dividida por uma categoria — mostra a associação desse tipo mais forte do conjunto de dados."
      grouped_violin: "Uma silhueta de distribuição por categoria: a mesma divisão da barra ao lado, mas mostrando toda a dispersão em vez de um único agregado."
      map: "Estes dados carregam coordenadas, então seus %{q_n} pontos são desenhados em um mapa interativo."
      choropleth: "Os valores agregam bem por região, então são sombreados sobre os limites regionais como coropleto."
      hierarchy: "Estas colunas categóricas se aninham, então sua composição é desenhada como hierarquia interativa — clique em um segmento para descer."
      sankey: "Um fluxo direcionado liga estas duas colunas, então seus cruzamentos são desenhados como diagrama de Sankey — a largura da fita é o volume do fluxo."
      parcats: "Várias colunas categóricas são lidas juntas aqui: cada fita traça as linhas que compartilham a mesma combinação de categorias."
      animated_scatter: "O par correlacionado também atravessa o tempo, então a dispersão é animada: aperte Play para ver a relação se construir cronologicamente."
      animated_geo: "Os pontos mapeados têm data, então o mapa é animado — aperte Play para ver os eventos se acumularem no mapa ao longo do tempo."
      animated_bubble: "Cada bolha é uma categoria traçando seu caminho por duas medidas ao longo do tempo — aperte Play para rodar o relógio."
      log_axis: "Seu eixo de valores é logarítmico, porque os valores abrangem várias ordens de grandeza."
      sampled: "Desenhado a partir de uma amostra determinística das linhas, para manter a fluidez."
