_version: 1

# Brazilian Portuguese (pt-BR) -- viz Data Schematic UI.
# TODO: native-speaker review before release. Accents ARE included (this file is
# UTF-8); the pending review is about wording and register, not encoding.
# Keys missing here fall back to en (see `fallback = "en"` in src/main.rs).
#
# The tag is pt-BR, not pt, because plotly publishes no generic `pt` locale --
# only `plotly-locale-pt-br`, whose internal id is `pt-BR`. `plotly_setlocale_js`
# passes `row.bcp47` straight to `Plotly.setPlotConfig`, so a `pt` row would
# register a locale plotly then never selects, silently leaving an English
# modebar. `--language pt` still works: it resolves through the `pt` alias.
#
# ORDERING RULE: in `hover`, every `%{q_*}` must stay AHEAD of any plotly token
# containing a literal `%` inside its braces (`%{x:.0%}`), or it is left
# unsubstituted. See the header of en.yml.
