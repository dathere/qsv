    count_by_label: "%{hovertext}<br>contagem: %{y:,}<extra></extra>"
    histogram: "%{q_col}: %{x:,.3f}<br>contagem: %{y:,}<extra></extra>"
    polar_records: "%{theta}<br>registros: %{r:,.0f}<extra></extra>"
    # Linhas de hover por região do coroplético. O `%` de `pct_of_total` é um sinal de
    # porcentagem LITERAL logo após um marcador, o que é seguro.
    pct_of_total: "%{q_pct}% do total"
    rank_of: "posição %{q_rank} de %{q_total}"
    snap_includes: "inclui %{q_n} ajustados de fora"
