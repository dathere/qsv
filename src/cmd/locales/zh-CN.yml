_version: 1

# Simplified Chinese (zh-CN) -- viz Data Schematic UI.
# TODO: native-speaker review before release. The pending review is about wording
# and register, not encoding (this file is UTF-8).
# Keys missing here fall back to en (see `fallback = "en"` in src/main.rs).
#
# SIMPLIFIED, not Traditional. The tag is zh-CN for two reasons: plotly ships only
# `plotly-locale-zh-cn` (internal id "zh-CN") with no generic `zh`, and DataTables'
# bare `zh.json` -- which this vendors -- is Simplified, with Traditional published
# separately as `zh-HANT`. `--language zh` resolves here through an alias, while
# `zh-Hant` deliberately does NOT, so a Traditional request can never silently be
# answered in Simplified.
#
# ORDERING RULE: in `hover`, every `%{q_*}` must stay AHEAD of any plotly token
# containing a literal `%` inside its braces (`%{x:.0%}`), or it is left
# unsubstituted. See the header of en.yml.
